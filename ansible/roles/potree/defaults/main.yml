---
# Potree release. Upstream changes rarely; to upgrade, bump the version and
# checksum, run `pixi run test`, then deploy. See docs/runbook.md.
potree_version: "1.8.2"
potree_release_url: "https://github.com/potree/potree/releases/download/{{ potree_version }}/Potree_{{ potree_version }}.zip"
potree_release_checksum: "sha256:c140a8bce0ce129de762fbc0fd3ba7c21120ffd36d423dd2755abb39f32aebe5"

# Path on YOUR machine to a Potree checkout with a fresh `npm run build`.
# When set, staging serves that build instead of the release above. For
# working on Potree itself; never set this for production.
potree_local_build: ""

# Releases unpack under potree_install_root/Potree_<version>; the web root
# links build/ and libs/ to the active release, so rollback is a version bump.
# Everything Apache reads lives under /var/www so SELinux's default label
# (httpd_sys_content_t) applies. Paths elsewhere (e.g. /opt) would need
# custom file contexts.
potree_install_root: /var/www/potree-releases
potree_web_root: /var/www/pointcloud

# Directory of collection folders to publish. Empty string skips content.
potree_content_src: ""

potree_server_name: localhost
potree_server_aliases: []

# letsencrypt: real certs via certbot from EPEL (production)
# selfsigned:  a self-signed cert generated by the role (local staging, tests)
potree_tls_mode: selfsigned
potree_letsencrypt_email: ""
potree_letsencrypt_webroot: /var/www/acme
potree_selfsigned_cert: /etc/pki/tls/certs/pointcloud-selfsigned.crt
potree_selfsigned_key: /etc/pki/tls/private/pointcloud-selfsigned.key

# HSTS turns any future cert failure into a hard browser error, so it is off
# until the cert watch (GitHub Action) has been running cleanly for a while.
potree_hsts_max_age: 0

# Paths hidden from the directory listing (still reachable by URL).
potree_autoindex_ignore:
  - branding
  - build
  - libs

# Host firewall (firewalld). The AWS security group already filters traffic;
# this is defense in depth. Off in containers, where firewalld can't run.
potree_manage_firewalld: true

# Automatic updates via dnf-automatic. Reboots only when an update needs one
# (kernel, glibc, systemd), shortly after the update run.
potree_auto_update_type: security   # security | default (all updates)
potree_auto_reboot: true

# AWS Systems Manager agent, for Session Manager shell access without SSH.
# Rocky AMIs don't ship it.
potree_install_ssm_agent: false

potree_journald_max_use: 200M
