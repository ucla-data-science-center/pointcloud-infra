---
# Validated automatically before the role runs; typos and bad values fail fast.
argument_specs:
  main:
    short_description: Serve Potree collections from Apache with TLS
    options:
      potree_version:
        type: str
        required: true
        description: Upstream Potree release tag.
      potree_release_url:
        type: str
        required: true
      potree_release_checksum:
        type: str
        required: true
        description: "Checksum of the release zip, as algorithm:hex."
      potree_local_build:
        type: str
        description: Local Potree checkout to serve instead of the release (staging only).
      potree_install_root:
        type: path
      potree_web_root:
        type: path
      potree_content_src:
        type: str
        required: true
        description: Local directory of collection folders to publish.
      potree_releases_root:
        type: path
      potree_keep_releases:
        type: int
      potree_require_selinux:
        type: bool
      potree_server_name:
        type: str
        required: true
      potree_server_aliases:
        type: list
        elements: str
      potree_canonical_redirect:
        type: bool
      potree_tls_mode:
        type: str
        choices: [letsencrypt, selfsigned]
      potree_letsencrypt_email:
        type: str
      potree_letsencrypt_webroot:
        type: path
      potree_hsts_max_age:
        type: int
      potree_autoindex_ignore:
        type: list
        elements: str
      potree_selfsigned_cert:
        type: path
      potree_selfsigned_key:
        type: path
      potree_manage_firewalld:
        type: bool
      potree_auto_update_type:
        type: str
        choices: [security, default]
      potree_auto_reboot:
        type: bool
      potree_install_ssm_agent:
        type: bool
      potree_journald_max_use:
        type: str
