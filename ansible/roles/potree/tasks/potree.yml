---
- name: Create Potree directories
  ansible.builtin.file:
    path: "{{ item }}"
    state: directory
    owner: root
    group: root
    mode: "0755"
  loop:
    - "{{ potree_install_root }}"
    - /var/cache/potree

# Default: the pinned upstream release. Unpacked to a temporary directory and
# moved into place only when complete, so a failed unzip never looks installed.
- name: Install Potree release
  when: potree_local_build | length == 0
  vars:
    _final: "{{ potree_install_root }}/Potree_{{ potree_version }}"
    _partial: "{{ potree_install_root }}/.partial-{{ potree_version }}"
  block:
    - name: Check for installed release
      ansible.builtin.stat:
        path: "{{ _final }}/build/potree/potree.js"
      register: _potree_installed

    - name: Download Potree release
      ansible.builtin.get_url:
        url: "{{ potree_release_url }}"
        dest: "/var/cache/potree/Potree_{{ potree_version }}.zip"
        checksum: "{{ potree_release_checksum }}"
        owner: root
        group: root
        mode: "0644"

    - name: Unpack and activate release
      when: not _potree_installed.stat.exists
      block:
        - name: Clear any partial unpack
          ansible.builtin.file:
            path: "{{ _partial }}"
            state: absent

        - name: Create partial directory
          ansible.builtin.file:
            path: "{{ _partial }}"
            state: directory
            owner: root
            group: root
            mode: "0755"

        - name: Unpack Potree release
          ansible.builtin.unarchive:
            src: "/var/cache/potree/Potree_{{ potree_version }}.zip"
            dest: "{{ _partial }}"
            remote_src: true

        - name: Move release into place
          ansible.builtin.command:
            argv: [mv, "{{ _partial }}/Potree_{{ potree_version }}", "{{ _final }}"]
            creates: "{{ _final }}"

        - name: Remove partial directory
          ansible.builtin.file:
            path: "{{ _partial }}"
            state: absent

    - name: Use the release
      ansible.builtin.set_fact:
        _potree_active_dir: "{{ _final }}"

# Development: a Potree checkout on your machine (after `npm run build`).
# Staging only; see docs/hacking-on-potree.md.
- name: Install local Potree build
  when: potree_local_build | length > 0
  vars:
    _potree_local_tar: "{{ lookup('env', 'TMPDIR') | default('/tmp', true) }}/pointcloud-potree-local.tar"
  block:
    - name: Refuse local builds outside staging
      ansible.builtin.assert:
        that: potree_tls_mode != 'letsencrypt'
        fail_msg: Local Potree builds are for staging only, never production.

    - name: Check the local build exists
      ansible.builtin.stat:
        path: "{{ potree_local_build }}/build/potree/potree.js"
      delegate_to: localhost
      become: false
      register: _potree_local_js

    - name: Fail if the local build is missing
      ansible.builtin.assert:
        that: _potree_local_js.stat.exists
        fail_msg: >-
          No build found at {{ potree_local_build }}/build/potree/potree.js.
          Run `npm install` (it also builds) in your Potree checkout first.

    - name: Pack local build and libs
      ansible.builtin.command:
        argv:
          - "{{ ansible_playbook_python }}"
          - "{{ role_path }}/files/pack_content.py"
          - --file-times
          - "{{ potree_local_build }}"
          - "{{ _potree_local_tar }}"
          - build
          - libs
      delegate_to: localhost
      become: false
      run_once: true
      changed_when: false

    - name: Install local build as a verified release
      ansible.builtin.include_tasks: release.yml
      vars:
        _potree_rel_tar: "{{ _potree_local_tar }}"
        _potree_rel_name: potree-local
        _potree_rel_root: "{{ potree_install_root }}"

    - name: Use the local build
      ansible.builtin.set_fact:
        _potree_active_dir: "{{ _potree_rel_dir }}"
