---
- name: Check for an existing Let's Encrypt certificate
  ansible.builtin.stat:
    path: "/etc/letsencrypt/live/{{ potree_server_name }}/fullchain.pem"
  register: _potree_le_cert

# Self-signed cert: used by staging, and by production until certbot has run
# (Apache needs some cert to start and answer the ACME challenge on port 80).
- name: Generate self-signed certificate
  ansible.builtin.command:
    argv:
      - openssl
      - req
      - -x509
      - -newkey
      - rsa:2048
      - -nodes
      - -days
      - "825"
      - -subj
      - "/CN={{ potree_server_name }}"
      - -keyout
      - "{{ potree_selfsigned_key }}"
      - -out
      - "{{ potree_selfsigned_cert }}"
    creates: "{{ potree_selfsigned_cert }}"

- name: Protect self-signed key
  ansible.builtin.file:
    path: "{{ potree_selfsigned_key }}"
    owner: root
    group: root
    mode: "0600"

- name: Choose TLS certificate
  ansible.builtin.set_fact:
    _potree_tls_cert: "{{ _le | ternary('/etc/letsencrypt/live/' ~ potree_server_name ~ '/fullchain.pem', potree_selfsigned_cert) }}"
    _potree_tls_key: "{{ _le | ternary('/etc/letsencrypt/live/' ~ potree_server_name ~ '/privkey.pem', potree_selfsigned_key) }}"
  vars:
    _le: "{{ potree_tls_mode == 'letsencrypt' and _potree_le_cert.stat.exists }}"

- name: Create ACME challenge directory
  ansible.builtin.file:
    path: "{{ potree_letsencrypt_webroot }}/.well-known/acme-challenge"
    state: directory
    owner: root
    group: root
    mode: "0755"

# Stock welcome.conf turns off directory listings at "/" and shows the Rocky
# test page instead. Our home page IS the listing, so neutralize it. Keeping
# the file (rather than deleting it) stops package updates from restoring it.
- name: Disable the stock welcome page
  ansible.builtin.copy:
    dest: /etc/httpd/conf.d/welcome.conf
    content: |
      # Disabled by Ansible (pointcloud-infra): the site root is a directory listing.
    owner: root
    group: root
    mode: "0644"
  notify: Reload httpd

- name: Install hardening config
  ansible.builtin.template:
    src: zz-pointcloud-hardening.conf.j2
    dest: /etc/httpd/conf.d/zz-pointcloud-hardening.conf
    owner: root
    group: root
    mode: "0644"
  notify: Reload httpd

- name: Install site config
  ansible.builtin.template:
    src: pointcloud.conf.j2
    dest: /etc/httpd/conf.d/pointcloud.conf
    owner: root
    group: root
    mode: "0644"
  notify: Reload httpd

- name: Start httpd
  ansible.builtin.systemd_service:
    name: httpd
    state: started
    enabled: true

- name: Open web ports in firewalld
  when: potree_manage_firewalld
  block:
    - name: Start firewalld
      ansible.builtin.systemd_service:
        name: firewalld
        state: started
        enabled: true

    - name: Allow HTTP, HTTPS and SSH
      ansible.posix.firewalld:
        service: "{{ item }}"
        permanent: true
        immediate: true
        state: enabled
      loop:
        - http
        - https
        - ssh
