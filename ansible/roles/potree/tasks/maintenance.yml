---
- name: Configure automatic updates
  community.general.ini_file:
    path: /etc/dnf/automatic.conf
    section: "{{ item.section }}"
    option: "{{ item.option }}"
    value: "{{ item.value }}"
    owner: root
    group: root
    mode: "0644"
  loop:
    - { section: commands, option: upgrade_type, value: "{{ potree_auto_update_type }}" }
    - { section: commands, option: apply_updates, value: "yes" }
    - { section: commands, option: reboot, value: "{{ potree_auto_reboot | ternary('when-needed', 'never') }}" }
  loop_control:
    label: "{{ item.option }}={{ item.value }}"

- name: Enable automatic update timer
  ansible.builtin.systemd_service:
    name: dnf-automatic.timer
    state: started
    enabled: true

# A full root disk is what silently broke cert renewal in August 2026.
- name: Create journald drop-in directory
  ansible.builtin.file:
    path: /etc/systemd/journald.conf.d
    state: directory
    owner: root
    group: root
    mode: "0755"

- name: Cap journald disk use
  ansible.builtin.copy:
    dest: /etc/systemd/journald.conf.d/size.conf
    content: |
      [Journal]
      SystemMaxUse={{ potree_journald_max_use }}
    owner: root
    group: root
    mode: "0644"
  notify: Restart journald
