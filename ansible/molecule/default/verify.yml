---
- name: Verify pointcloud web server
  hosts: web
  gather_facts: false
  vars:
    base: https://localhost
  tasks:
    - name: Apache config is valid
      ansible.builtin.command: apachectl configtest
      changed_when: false

    - name: Fetch the directory listing
      ansible.builtin.uri:
        url: "{{ base }}/"
        validate_certs: false
        return_content: true
      register: listing

    - name: Listing is skinned and shows collections, not Potree internals
      ansible.builtin.assert:
        that:
          - "'<table id=\"indexlist\">' in listing.content"
          - "'/branding/ucla-index.css' in listing.content"
          - "'ucla-header' in listing.content"
          - "'Iceland/' in listing.content"
          - "'href=\"build/\"' not in listing.content"
          - "'href=\"libs/\"' not in listing.content"
          - listing.server == 'Apache'
          - listing.x_content_type_options == 'nosniff'

    - name: Read automatic update timer status
      ansible.builtin.systemd_service:
        name: dnf-automatic.timer
      register: dnf_timer

    - name: Automatic updates are enabled and scheduled
      ansible.builtin.assert:
        that:
          - dnf_timer.status.UnitFileState == 'enabled'
          - dnf_timer.status.ActiveState == 'active'

    - name: Fetch a collection listing
      ansible.builtin.uri:
        url: "{{ base }}/Iceland/"
        validate_certs: false
        return_content: true
      register: iceland

    - name: Descriptions from content/descriptions.yml appear in the listing
      ansible.builtin.assert:
        that:
          - "'All Days Merged and Classified' in iceland.content"
          - "'indexcoldesc' in iceland.content"

    - name: Fetch the root listing
      ansible.builtin.uri:
        url: "{{ base }}/"
        validate_certs: false
        return_content: true
      register: root_listing

    - name: Folder descriptions match whole names only
      ansible.builtin.assert:
        that:
          # "Test" must label only Test/, not other names containing "Test"
          - root_listing.content is search('href="Test/".*?Test page, not a collection', multiline=True)
          - root_listing.content.count('Test page, not a collection') == 1

    - name: Potree assets are cacheable
      ansible.builtin.uri:
        url: "{{ base }}/build/potree/potree.js"
        validate_certs: false
      register: potree_js

    - name: Cache header is set
      ansible.builtin.assert:
        that: "'max-age=86400' in potree_js.cache_control"

    - name: Viewer and branding assets are served
      ansible.builtin.uri:
        url: "{{ base }}/{{ item }}"
        validate_certs: false
      loop:
        - build/potree/potree.js
        - build/potree/potree.css
        - libs/three.js/build/three.min.js
        - branding/ucla-library-logo.png
        - Iceland/

    - name: Plain HTTP redirects to the canonical HTTPS name
      ansible.builtin.uri:
        url: http://localhost/Iceland/
        follow_redirects: none
        status_code: 301
      register: redirect

    - name: Redirect target is correct
      ansible.builtin.assert:
        that:
          - redirect.location == 'https://www.pointcloud.ucla.edu/Iceland/'
