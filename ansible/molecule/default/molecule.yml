---
# Local staging: Rocky Linux 10 with systemd in a Podman container, configured
# by the same playbook as production. Differences from production: self-signed
# TLS, no firewalld, no SELinux, no SSM agent, no automatic reboots, and S3
# point cloud data doesn't load (the bucket only serves www.pointcloud.ucla.edu).
# Those paths are checked on a real host: docs/acceptance.md.
scenario:
  test_sequence:
    - dependency
    - destroy
    - syntax
    - create
    - converge
    - idempotence
    - verify
    - destroy

dependency:
  name: galaxy
  options:
    requirements-file: requirements.yml

driver:
  name: podman

platforms:
  - name: pointcloud-staging
    # Pinned by digest (multi-arch index) so staging doesn't change under us.
    # To update: take the new digest from Docker Hub, then `pixi run test`.
    image: docker.io/geerlingguy/docker-rockylinux10-ansible@sha256:c4056504bdd5e7c61f18325f3df704a03913d50f50c952298bbc15e81ddbbe8e
    pre_build_image: true
    command: /usr/sbin/init
    systemd: always
    groups:
      - web
    published_ports:
      - "127.0.0.1:8443:443/tcp"
      - "127.0.0.1:8080:80/tcp"

provisioner:
  name: ansible
  env:
    ANSIBLE_ROLES_PATH: ../../roles
    ANSIBLE_COLLECTIONS_PATH: ../../collections
  inventory:
    group_vars:
      web:
        potree_tls_mode: selfsigned
        # Containers have no firewall, kernel to reboot, or AWS agent.
        # SELinux is also inactive in containers; production enforces it.
        potree_manage_firewalld: false
        potree_require_selinux: false
        potree_auto_reboot: false
  playbooks:
    converge: ../../playbooks/site.yml

verifier:
  name: ansible
