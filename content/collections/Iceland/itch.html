<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<meta name="description" content="ITCH SYMPOSIUM">
	<meta name="author" content="">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
	<title>ITCH Symposium</title>
	<link rel="icon" type="image/png" href="ucla_favicon.png">

	<link rel="stylesheet" type="text/css" href="../build/potree/potree.css">
	<link rel="stylesheet" type="text/css" href="../libs/jquery-ui/jquery-ui.min.css">
	<link rel="stylesheet" type="text/css" href="../libs/openlayers3/ol.css">
	<link rel="stylesheet" type="text/css" href="../libs/spectrum/spectrum.css">
	<link rel="stylesheet" type="text/css" href="../libs/jstree/themes/mixed/style.css">
</head>

<body>
	<script src="../libs/jquery/jquery-3.1.1.min.js"></script>
	<script src="../libs/spectrum/spectrum.js"></script>
	<script src="../libs/jquery-ui/jquery-ui.min.js"></script>
	<script src="../libs/three.js/build/three.min.js"></script>
	<script src="../libs/three.js/extra/lines.js"></script>
	<script src="../libs/other/BinaryHeap.js"></script>
	<script src="../libs/tween/tween.min.js"></script>
	<script src="../libs/d3/d3.js"></script>
	<script src="../libs/proj4/proj4.js"></script>
	<script src="../libs/openlayers3/ol.js"></script>
	<script src="../libs/i18next/i18next.js"></script>
	<script src="../libs/jstree/jstree.js"></script>
	<script src="../build/potree/potree.js"></script>
	<script src="../libs/plasio/js/laslaz.js"></script>

	<div class="potree_container" style="position: absolute; width: 100%; height: 100%; left: 0px; top: 0px;">

		<header id="main-header">
			<div id="header-secondary">
				<div class="header-container">
					
					<div class="logos-container">
						<a href="https://www.library.ucla.edu/" target="_blank" class="logo-link" id="logo-rmci">
							<img src="UCLA_logo.png" alt="UCLA Library">
						</a>
					</div>
					
					<nav id="category-tabs">
						<ul>
							</ul>
					</nav>
					
				</div>
			</div>
		</header>
		
        <div id="potree_render_area" class="area">
			
			<div id="info-box" style="display: none;">
                <div id="info-box-content">
					</div>

				</div>

			<div id="debug-info-floater" class="debug-hidden">
				<div class="debug-section">
					<strong>Camera Position:</strong>
					<code id="debug-cam-pos"></code>
				</div>
				<div class="debug-section">
					<strong>Camera Target:</strong>
					<code id="debug-cam-target"></code>
				</div>
				<hr>
				<div class="debug-section">
					<strong>Object Position:</strong>
					<code id="debug-obj-pos"></code>
				</div>
				<div class="debug-section">
					<strong>Object Rotation:</strong>
					<code id="debug-obj-rot"></code>
				</div>
			</div>

		</div>

		<div id="potree_sidebar_container"> </div>

	</div>

	<style>
		body {
			margin: 0;
			font-family: sans-serif;
		}

		#main-header {
			position: absolute;
			top: 0;
			left: 0;
			width: 100%;
			background: white; 
			z-index: 10;
			box-shadow: 0 2px 5px rgba(0,0,0,0.2); 
			height: 12.5vh; 
		}

		.header-container {
			width: 90%;
			max-width: 1400px; 
			margin: 0 auto; 
			display: flex;
			justify-content: space-between; 
			align-items: center;
            height: 100%; 
		}

		#header-secondary {
			width: 100%;
            height: 100%; 
		}
		
		.logos-container {
			display: flex;
			align-items: center;
			justify-content: flex-start; 
		}

		.logo-link {
			display: inline-block;
			margin-right: 20px; 
		}

		#header-secondary img {
			height: 10vh; 
			width: auto;
			display: block;
		}

		#category-tabs ul {
			display: flex;
			flex-direction: row;
			list-style: none;
			margin: 0;
			padding: 0;
			justify-content: flex-end; 
		}

		#category-tabs li {
			padding: 2.5vh 2.5vh;
			cursor: pointer;
			border-bottom: 3px solid transparent;
			transition: background-color 0.2s, border-color 0.2s;
			color: black; 
			font-size: 1.1em; 
			font-weight: 500;
			margin-left: 8px;
			text-align: center;
		}

		#category-tabs li:hover {
			background-color: rgba(0, 0, 0, 0.05); 
		}

		#category-tabs li.active {
			border-bottom-color: #FFD700; 
			font-weight: 700;
		}

		#info-box {
			position: absolute;
			bottom: 20px;
			left: 20px;
			width: 30vw;
			height: 31.25vh; 
			background-color: rgba(0, 0, 0, 0.8);
			z-index: 2;
			color: white;
			border-radius: 7px;
			display: flex;
			flex-direction: column;
		}
		
		#info-box-content {
			padding: 15px;
			overflow-y: auto; 
			line-height: 1.5;
		}

		#potree_render_area {
			position: absolute;
			top: 12.5vh; 
			left: 0;
			width: 100%;
			height: calc(100% - 12.5vh);
		}

		/* ==================================================================
		  == DEBUG PANEL STYLES ==
		  ==================================================================
		*/
		#debug-info-floater {
			position: absolute;
			top: 15px;
			right: 15px;
			background-color: rgba(0, 0, 0, 0.75);
			color: white;
			padding: 10px 15px;
			border-radius: 5px;
			z-index: 100;
			font-family: 'Courier New', Courier, monospace;
			font-size: 14px;
			line-height: 1.6;
			min-width: 300px;
		}

		#debug-info-floater .debug-section {
			margin-bottom: 5px;
		}

		#debug-info-floater strong {
			color: #ffd700;
		}
		
		#debug-info-floater code {
			color: #00ff00;
			display: block;
			margin-left: 10px;
		}

		#debug-info-floater hr {
			border: none;
			border-top: 1px solid #555;
			margin: 8px 0;
		}

		.debug-hidden {
			display: none;
		}

	</style>

	<script>
		const museumData = {
			"Helgi's Tolfjar": {
				name: "<em>Torfljár</em> <q>Turf Scythe</q>",
				objects: [
					{
						id: "helgi",
						name: "Helgi's Tolfjar",
						cloudUrl: "https://potree-test2.s3.us-west-2.amazonaws.com/Iceland/IcelandicTurfArchitecture/8_6_24Helgi'sTorfljar/helgi_torfljar_1_converted/metadata.json",
						description: `
                        <div class="artifact-card">
                            <h3>Torfljár "Turf Scythe"</h3>
                            <p>This custom-built, handheld scythe must be frequently sharpened with a whetstone and is used by one person to cut strip forms of turf. This mid-century example must be a derivative of scythe forms that have persisted from even well before the Viking diaspora of the ninth-eleventh centuries.</p>
                        </div>
                        `, 
						cameraPos: [687, 522, 576],
						cameraTarget: [100, 200, 200],
						rotation: [0, 0, 0],
						position: [0, 0, 0]
					}
				]
			},
			"pall_glaumbaer": {
				name: "<em>Páll</em> <q>Spade</q>",
				objects: [
					{
						cloudUrl: "https://potree-test2.s3.us-west-2.amazonaws.com/Iceland/IcelandicTurfArchitecture/8_7_24GlaumbaerMuseumObjects/pall_glaumbaer_1_reduced_converted/metadata.json",
						description: `
                        <div class="artifact-card">
                            <h3>Páll "Spade"</h3>
                            <p>This spade's wide wooden handle and metal step signal its use as a turf-cutting tool. Spade forms, and their relationship to turf and peat cutting, are an ongoing topic of the author's research.</p>
                    	</div>
                        `,
						cameraPos: [641, -700, 1100],
						cameraTarget: [125, 11, 580],
						rotation: [0, 0, 0],
						position: [0, 0, 0]
					}
				]
			},
			"klambra fresh": {
				name: "<em>Klambra</em> <q>Clamped Block</q>",
				objects: [
					{
						cloudUrl: "https://potree-test2.s3.us-west-2.amazonaws.com/Iceland/IcelandicTurfArchitecture/8_11_24TurfBlocksStrips-Helgis/klambra_fresh_1/metadata.json",
						description: `
                        <div class="artifact-card">
                            <h3>Klambra "Clamped Block"</h3>
                            <p>This wedge-shaped turf form is cut with tools like the páll. After klömbrur are dried, transported, and tightly laid in courses with the tops of the soil facing down, the upper twenty percent of the parallelogram facing outward—which in profile tapers into a tail—is chopped off.</p>
                        </div>
                        `,
						cameraPos: [810, 460, 395],
						cameraTarget: [400, 295, 100],
						rotation: [0, 0, 0],
						position: [0, 0, 0]
					},
				]
			},
			"complete haus": {
				name: "<em>Hnaus</em> (Complete) <q>Clamped Block</q>",
				objects: [
					{
						cloudUrl: "https://potree-test2.s3.us-west-2.amazonaws.com/Iceland/IcelandicTurfArchitecture/8_8_24TurfBlocksStrips-Helgis/hnaus_complete_1_converted/metadata.json",
						description: `
						<div class="artifact-card">
						    <h3>Hnaus (Complete) "Block"</h3>
    						<p>This rectilinear turf block is mimetic to forms typical of stone masonry. They are associated with outbuildings more than human dwellings, and are often laid so that gaps are bridged.</p>
						</div>
						`,
						cameraPos: [-228, -745, 372],
						cameraTarget: [70, -260, 156],
						rotation: [0, 0, -Math.PI * 0.5],
						position: [0, 0, -100]
					},
				]
			},

			"trimmed haus": {
				name: "<em>Hnaus</em> (Trimmed) <q>Block</q>",
				objects: [
					{
						cloudUrl: "https://potree-test2.s3.us-west-2.amazonaws.com/Iceland/IcelandicTurfArchitecture/8_8_24TurfBlocksStrips-Helgis/hnaus_trimmed_1_converted/metadata.json",
						description: `
                        <div class="artifact-card">
                            <h3>Hnaus (Trimmed) "Block"</h3>
                            <p>This block is the same as that before it, but modified. It has been trimmed to create a ledge for the turf strips that will span the wall's cavity.</p>
                        </div>
                        `,
						cameraPos: [-375, -565, 0],
						cameraTarget: [50, -200, 69],
						rotation: [0, 0, -Math.PI * 0.5],
						position: [0, 0, -100]
					},
				]
			}
		};

		window.viewer = new Potree.Viewer(document.getElementById("potree_render_area"));
		viewer.loadSettingsFromURL();
		viewer.setEDLEnabled(true);
		viewer.setFOV(60);
		viewer.setPointBudget(4 * 1000 * 1000);
		viewer.setMinNodeSize(0);
		viewer.loadGUI(() => {
			$(".potree_menu_toggle").hide();
		});

		window.allPointClouds = []; 
		let currentVisibleCloud = null;
		let currentActiveObject = null;
		let isTextureToggled = false;
		
		const categoryTabsContainer = document.querySelector("#category-tabs ul");
		const infoBox = document.getElementById("info-box");
		const infoBoxContent = document.getElementById("info-box-content");

		function loadAllObjects() {
			let uniqueUrls = new Map();

			for (const categoryId in museumData) {
				museumData[categoryId].objects.forEach(obj => {
					if (!uniqueUrls.has(obj.cloudUrl)) {
						uniqueUrls.set(obj.cloudUrl, {
							name: obj.name,
							dependents: [obj] 
						});
					} else {
						uniqueUrls.get(obj.cloudUrl).dependents.push(obj);
					}
				});
			}

			uniqueUrls.forEach((data, url) => {
				Potree.loadPointCloud(url, data.name, function (e) {
					console.log(`Loaded: ${data.name}`);
					viewer.scene.addPointCloud(e.pointcloud);
					window.allPointClouds.push(e.pointcloud);

					data.dependents.forEach(objectData => {
						objectData.pointcloud = e.pointcloud;
						
						let material = e.pointcloud.material;
						material.pointColorType = Potree.PointColorType.RGBA; // Default to texture
						material.size = 0.66;
						material.pointSizeType = Potree.PointSizeType.ADAPTIVE;
						material.shape = Potree.PointShape.CIRCLE;
					});

					e.pointcloud.visible = false; 
				});
			});
		}

		function populateCategoryTabs() {
			categoryTabsContainer.innerHTML = ""; 
			for (const categoryId in museumData) {
				const category = museumData[categoryId];
				const tab = document.createElement("li");
				tab.innerHTML = category.name;
				tab.dataset.categoryId = categoryId;
				tab.addEventListener("click", () => showCategory(categoryId));
				categoryTabsContainer.appendChild(tab);
			}
		}

		function showCategory(categoryId) {
			categoryTabsContainer.querySelectorAll("li").forEach(tab => {
				tab.classList.toggle("active", tab.dataset.categoryId === categoryId);
			});

			if (currentVisibleCloud) {
				currentVisibleCloud.visible = false;
				currentVisibleCloud = null;
			}
			infoBox.style.display = "none";
			currentActiveObject = null;
			
			const firstObject = museumData[categoryId].objects[0];
			if (firstObject) {
				
				const showFirstObject = () => {
					if (firstObject.pointcloud) {
						showModel(firstObject);
					} else {
						console.log("Waiting for", firstObject.name, "to load...");
						setTimeout(showFirstObject, 200); // check again in 200ms
					}
				};
				
				showFirstObject();
				
			} else {
				 window.allPointClouds.forEach(p => {
					p.visible = false;
				 });
				 currentVisibleCloud = null;
			}
		}

		function showModel(objectData) {
			if (!objectData || !objectData.pointcloud) {
				console.warn("Attempted to show a model that is not loaded yet:", objectData);
				return;
			}
			
			window.allPointClouds.forEach(p => {
				p.visible = false;
			});

			objectData.pointcloud.visible = true;
			objectData.pointcloud.rotation.set(...objectData.rotation);
			objectData.pointcloud.position.set(...objectData.position);

			currentVisibleCloud = objectData.pointcloud;
			currentActiveObject = objectData;

			isTextureToggled = false;
			const material = currentVisibleCloud.material;
			material.activeAttributeName = "rgba";
			viewer.setEDLEnabled(true);
			viewer.setEDLStrength(1.0);

			viewer.scene.view.position.set(...objectData.cameraPos);
			viewer.scene.view.lookAt(...objectData.cameraTarget);

			infoBoxContent.innerHTML = objectData.description;
			infoBox.style.display = "flex";
		}
		
		function setupCameraDebugDisplay() {
			const elCamPos = document.getElementById("debug-cam-pos");
			const elCamTarget = document.getElementById("debug-cam-target");
			const elObjPos = document.getElementById("debug-obj-pos");
			const elObjRot = document.getElementById("debug-obj-rot");

			const formatVec = (v) => {
				if (!v) return "N/A";
				const x = v.x !== undefined ? v.x : v[0];
				const y = v.y !== undefined ? v.y : v[1];
				const z = v.z !== undefined ? v.z : v[2];
				return `[${x.toFixed(2)}, ${y.toFixed(2)}, ${z.toFixed(2)}]`;
			};

			const formatRot = (r) => {
				if (!r) return "N/A";
				const x = r.x.toFixed(3);
				const y = r.y.toFixed(3);
				const z = r.z.toFixed(3);
				return `[${x}, ${y}, ${z}]`;
			}

			setInterval(() => {
				const camPos = viewer.scene.view.position;
				const camTarget = viewer.scene.view.getPivot();

				elCamPos.innerText = formatVec(camPos);
				elCamTarget.innerText = formatVec(camTarget);

				if (currentVisibleCloud) {
					elObjPos.innerText = formatVec(currentVisibleCloud.position);
					elObjRot.innerText = formatRot(currentVisibleCloud.rotation);
				} else {
					elObjPos.innerText = "N/A";
					elObjRot.innerText = "N/A";
				}

			}, 250);
		}

		function setupDebugToggle() {
			const debugPanel = document.getElementById("debug-info-floater");
			
			window.addEventListener("keydown", (e) => {
				if (e.key === 'd' || e.key === 'D') {
					debugPanel.classList.toggle("debug-hidden");
				}
			});
		}

		function setupTextureToggle() {
			window.addEventListener("keydown", (e) => {
				if (e.key !== 't' && e.key !== 'T') {
					return;
				}

				if (!currentVisibleCloud) {
					return;
				}

				const material = currentVisibleCloud.material;

				if (isTextureToggled) {
					material.activeAttributeName = "rgba";
					viewer.setEDLStrength(1.0);
					isTextureToggled = false;
				} else {
					material.activeAttributeName = "classification";
					viewer.setEDLStrength(2.0);
					isTextureToggled = true;
				}
			});
		}

		function setupFullscreenToggle() {
			function openFullscreen() {
				console.log("Attempting to enter fullscreen...");
				const elem = document.documentElement;
				
				const promise = (elem.requestFullscreen && elem.requestFullscreen()) ||
								(elem.mozRequestFullScreen && elem.mozRequestFullScreen()) ||
								(elem.webkitRequestFullscreen && elem.webkitRequestFullscreen()) ||
								(elem.msRequestFullscreen && elem.msRequestFullscreen());

				if (promise) {
					promise.catch(err => {
						console.error(`Error attempting to enter fullscreen: ${err.message} (${err.name})`);
						console.warn("Fullscreen request was denied. This often happens if not triggered by a direct user click, or if security policies (e.g., in an iframe) block it.");
					});
				} else {
					console.warn("No fullscreen API available on this element.");
				}
			}

			function closeFullscreen() {
				console.log("Attempting to exit fullscreen...");

				const promise = (document.exitFullscreen && document.exitFullscreen()) ||
								(document.mozCancelFullScreen && document.mozCancelFullScreen()) ||
								(document.webkitExitFullscreen && document.webkitExitFullscreen()) ||
								(document.msExitFullscreen && document.msExitFullscreen());
				
				if (promise) {
					promise.catch(err => {
						console.error(`Error attempting to exit fullscreen: ${err.message} (${err.name})`);
					});
				} else {
					console.warn("No exit fullscreen API available on this document.");
				}
			}

			window.addEventListener("keydown", (e) => {
				if (e.key !== 'f' && e.key !== 'F') {
					return;
				}

				const isFullscreen = document.fullscreenElement ||
									 document.webkitFullscreenElement ||
									 document.mozFullScreenElement ||
									 document.msFullscreenElement;
				
				console.log("'f' key pressed. Current state:", isFullscreen ? "Fullscreen" : "Windowed");

				if (isFullscreen) {
					closeFullscreen();
				} else {
					openFullscreen();
				}
			});
		}

		loadAllObjects();
		populateCategoryTabs();
		setupCameraDebugDisplay(); // Initialize the debug data feed
		setupDebugToggle(); // Initialize the 'd' key listener
		setupTextureToggle(); // Initialize the 't' key listener
		setupFullscreenToggle(); // Initialize the 'f' key listener

		showCategory("Helgi's Tolfjar"); 

	</script>
</body>

</html>
