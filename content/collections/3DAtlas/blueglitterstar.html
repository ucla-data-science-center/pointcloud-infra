    <div class="potree_container" style="position: absolute; width: 100%; height: 100%; left: 0px; top: 0px; ">
		<div id="potree_description" class="potree_info_text" style="z-index: 100px; font-size: small; font-family: 'Work Sans', sans-serif;">
            Blue Glitter Star Scans
           <!-- <button id="jpgbtn">Object Photo</button> <br> -->
		</div>
		<!-- <div id="potree_sidebar_container" style="width: 300px; height: 100%; z-index:500px;">
		</div> -->
		<div id="potree_render_area" style="background: rgb(243, 243, 243);"></div>
			<div id="potree_toolbar" style="position: absolute; z-index: 200; max-width: 50px; right: 100px; top: 0px; font-size: smaller; font-family: 'Work Sans' !important;">
				<span>
					<div class="potree_toolbar_label" >
						Material
					</div>
					<div>
						<select id="optMaterial" name="optMaterial"></select>
					</div>
				</span>
			</div>
		</div>
		<div style="position: absolute;  z-index: 50; right: 0px; top: 70px;" id="jpg">
		</div>

    <script>
        //Toggle image
        const jpg = document.getElementById("jpg");
        const btn = document.getElementById("jpgbtn");
        
        btn.addEventListener("click",
            function () {
                if (jpg.innerHTML === '<img src="https://potree-test2.s3.us-west-2.amazonaws.com/3DAtlas/objectphotos/blueglitterstar.jpg" style="width:400px">') {
                    jpg.innerHTML = ''
                } else {
                    jpg.innerHTML = '<img src="https://potree-test2.s3.us-west-2.amazonaws.com/3DAtlas/objectphotos/blueglitterstar.jpg" style="width:400px">'
                }
            });
    </script>


    <script>
        window.viewer = new Potree.Viewer(document.getElementById("potree_render_area"));
        
        viewer.loadGUI(() => {
            viewer.setLanguage('en');
            $("#menu_appearance").next().show();
            // viewer.toggleSidebar();
        });
        
        viewer.setEDLEnabled(true);
        viewer.setFOV(60);
        viewer.setPointBudget(4 * 1000 * 1000);
        viewer.loadSettingsFromURL();
        
      
        viewer.scene.view.position.set(2280, -3250, 1650);
        viewer.scene.view.lookAt(2250, 1000, 0);
 
       		Potree.loadPointCloud("https://potree-test2.s3.us-west-2.amazonaws.com/3DAtlas/pointclouds/UCLA_BlueGlitterStar_Artec_converted/metadata.json", "Artec Space Spider").then(e => {
            viewer.scene.addPointCloud(e.pointcloud);
        
            let material = e.pointcloud.material;
            material.activeAttributeName = "classification";
            material.minSize = 2;
            material.pointSizeType = Potree.PointSizeType.ADAPTIVE;
            material.shape = Potree.PointShape.CIRCLE;
        
            e.pointcloud.scale.set(20, 20, 20);
            e.pointcloud.position.set(0, 0, 800);
            e.pointcloud.rotation.set(Math.PI * .07, Math.PI * 0, Math.PI * .3);
      
        });
        
        
        		Potree.loadPointCloud("https://potree-test2.s3.us-west-2.amazonaws.com/3DAtlas/pointclouds/UCSF_SmallBlueGlitterStar_EinScan-SP_converted/metadata.json", "EinScan SP").then(e => {
            viewer.scene.addPointCloud(e.pointcloud);
        
            let material = e.pointcloud.material;
            material.activeAttributeName = "classification";
            material.minSize = 2;
            material.pointSizeType = Potree.PointSizeType.ADAPTIVE;
            material.shape = Potree.PointShape.CIRCLE;
        
            e.pointcloud.scale.set(20, 20, 20);
            e.pointcloud.position.set(1500, 0, 800);
            e.pointcloud.rotation.set(Math.PI * .055, Math.PI * 0, Math.PI * .225);
          
        });
        
        
        		Potree.loadPointCloud("https://potree-test2.s3.us-west-2.amazonaws.com/3DAtlas/pointclouds/UCR_blueglitterstar__converted/metadata.json", "EinScan Pro").then(e => {
            viewer.scene.addPointCloud(e.pointcloud);
        
            let material = e.pointcloud.material;
            material.activeAttributeName = "classification";
            material.minSize = 2;
            material.pointSizeType = Potree.PointSizeType.ADAPTIVE;
            material.shape = Potree.PointShape.CIRCLE;
        
            e.pointcloud.scale.set(20, 20, 20);
            e.pointcloud.rotation.set(Math.PI * .055, Math.PI * 0, Math.PI * .225);
            e.pointcloud.position.set(3000, 0, 800);
        
        
        });
        
        		Potree.loadPointCloud("https://potree-test2.s3.us-west-2.amazonaws.com/3DAtlas/pointclouds/UCBEinscanSEblueglitterstar_converted/metadata.json", "EinScan SE").then(e => {
            viewer.scene.addPointCloud(e.pointcloud);
        
            let material = e.pointcloud.material;
            material.activeAttributeName = "classification";
            material.minSize = 2;
            material.pointSizeType = Potree.PointSizeType.ADAPTIVE;
            material.shape = Potree.PointShape.CIRCLE;
        
            e.pointcloud.scale.set(20, 20, 20);
            e.pointcloud.rotation.set(Math.PI * .075, Math.PI * -.05, Math.PI * .19);
            e.pointcloud.position.set(4500, 0, 800);
           
        
        });
        
        let a1 = new Potree.Annotation({
            position: [0, 0, 800],
            title: `Artec Space Spider`,
            description:"Scanning: 3 min. <br> Processing: 2 min. /3 min. with texture <br> Software: Artec Studio v16 <br> Campus: UCLA" ,
        });
        viewer.scene.annotations.add(a1);
        
        let a2 = new Potree.Annotation({
            position: [1500, 0, 800],
            title: `EinScan SP`,
            description:"Scanning: 4 min. 4 sec. <br> Processing: 1 min. 21 sec. <br> Software: EX-Scan-S v3.1.2.0 <br> Campus: UCSF" ,
        });
        viewer.scene.annotations.add(a2);
        
        let a3 = new Potree.Annotation({
            position: [3000, 0, 800],
            title: `EinScan Pro`,
            description:"Scanning: 5 min. 2 sec. <br> Processing: 1 min. 38 sec. <br> Software: EinScan Mac v1.5.0 <br> Campus: UCB" ,
        });
        
        viewer.scene.annotations.add(a3);
        
        
        let a4 = new Potree.Annotation({
            position: [4500, 0, 800],
            title: `EinScan SE`,
            description:"Scanning: 1 min. 24 sec. <br> Processing: 15 sec. <br> Software:  <br> Campus: UCR" ,
        });
        viewer.scene.annotations.add(a4);
        
              
        Potree.loadPointCloud("https://potree-test2.s3.us-west-2.amazonaws.com/3DAtlas/pointclouds/UCSC_BlueStar_EinscanPro2HD_converted/metadata.json", "EinScan Pro 2").then(e => {
            viewer.scene.addPointCloud(e.pointcloud);
          
            let material = e.pointcloud.material;
            material.activeAttributeName = "classification";
            material.minSize = 2;
            material.pointSizeType = Potree.PointSizeType.ADAPTIVE;
            material.shape = Potree.PointShape.CIRCLE;       
            e.pointcloud.scale.set(20, 20, 20);
            e.pointcloud.position.set(0, 0, -1050);
            e.pointcloud.rotation.set(Math.PI * .07, Math.PI * 0, Math.PI * .3);
           
        
        });
        
        
        Potree.loadPointCloud("https://potree-test2.s3.us-west-2.amazonaws.com/3DAtlas/pointclouds/UCSC_BlueStar_EinscanPro2Color_converted/metadata.json", "EinScan Pro 2").then(e => {
            viewer.scene.addPointCloud(e.pointcloud);
        
            let material = e.pointcloud.material;
            material.activeAttributeName = "classification";
            material.minSize = 2;
            material.pointSizeType = Potree.PointSizeType.ADAPTIVE;
            material.shape = Potree.PointShape.CIRCLE;

            e.pointcloud.scale.set(20, 20, 20);
            e.pointcloud.position.set(1500, 0, -1050);
            e.pointcloud.rotation.set(Math.PI * .055, Math.PI * 0, Math.PI * .225);
        });
        
        
        Potree.loadPointCloud("https://potree-test2.s3.us-west-2.amazonaws.com/3DAtlas/pointclouds/UCSC_BlueStar_Photogrammetry_Canon6D_Meshroom_converted/metadata.json", "Canon").then(e => {
            viewer.scene.addPointCloud(e.pointcloud);
        
            let material = e.pointcloud.material;
            material.activeAttributeName = "classification";
            material.minSize = 2;
            material.pointSizeType = Potree.PointSizeType.ADAPTIVE;
            material.shape = Potree.PointShape.CIRCLE;
        
            e.pointcloud.scale.set(6510, 6510, 6510);
            e.pointcloud.rotation.set(Math.PI * .055, Math.PI * 0, Math.PI * .225);
            e.pointcloud.position.set(3000, -800, -1400);
       });
        
        Potree.loadPointCloud("https://potree-test2.s3.us-west-2.amazonaws.com/3DAtlas/pointclouds/UCSC_BlueStar_Photogrammetry_iPhone13_Meshroom_converted/metadata.json", "iPhone").then(e => {
            viewer.scene.addPointCloud(e.pointcloud);
        
            let material = e.pointcloud.material;
            material.activeAttributeName = "classification";
            material.minSize = 2;
            material.pointSizeType = Potree.PointSizeType.ADAPTIVE;
            material.shape = Potree.PointShape.CIRCLE;
        
            e.pointcloud.scale.set(800, 800, 800);
            e.pointcloud.rotation.set(Math.PI * .075, Math.PI * -.05, Math.PI * .19);
            e.pointcloud.position.set(4600, 0, -1300);
        });
        
        
        let a5 = new Potree.Annotation({
            position: [0, 0, -850],
            title: `EinScan Pro2 + HD`,
            description: "Scanning: 45 min.  <br> Processing: 2 min. <br> Software: EinScan Pro 2  <br> Campus: UCSC" ,
        });
             
         viewer.scene.annotations.add(a5);

      let a6 = new Potree.Annotation({
            position: [1500, 0, -850],
            title: `EinScan Pro2 + Color`,
            description:"Scanning: 50 min.  <br> Processing: 2 min. <br> Software: EinScan Pro 2  <br> Campus: UCSC" ,
        });
       viewer.scene.annotations.add(a6);
        
        let a7 = new Potree.Annotation({
            position: [3000, 0, -850],
            title: `Canon`,
            description: "Software: photogrammetry via Meshroom <br> Camera: Canon <br> Campus: UCSC" ,
        });
            viewer.scene.annotations.add(a7);
        
        let a8 = new Potree.Annotation({
            position: [4600, 0, -850],
            title: `iPhone`,
            description: "Software: photogrammetry via Meshroom <br> Camera: iPhone <br> Campus: UCSC" ,
        });
            viewer.scene.annotations.add(a8);
    </script>

    
    <script>
        const elToolbar = $("#potree_toolbar");
        { // MATERIAL
            let options = [
                "grayscale",
                "color",
            ];
        
            let attributeSelection = elToolbar.find('#optMaterial');
            for (let option of options) {
                let elOption = $(`<option>${option}</option>`);
                attributeSelection.append(elOption);
            }
        
            const updateMaterialSelection = (event, ui) => {
        
                if (attributeSelection.selectmenu().val() === "grayscale") {
                    let selectedValue = "classification";
        
                    for (const pointcloud of viewer.scene.pointclouds) {
                        pointcloud.material.activeAttributeName = selectedValue;
                    };
                }
                else {
                    let selectedValue = "rgba";
                    for (const pointcloud of viewer.scene.pointclouds) {
                        pointcloud.material.activeAttributeName = selectedValue;
                    };
                };
            };
            attributeSelection.selectmenu({ change: updateMaterialSelection });
        }
    </script>

</body>
