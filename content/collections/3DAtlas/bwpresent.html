<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<meta name="description" content="">
	<meta name="author" content="">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
	<title>3D Atlas</title>

	<link href="https://fonts.googleapis.com/css2?family=Roboto:ital,wght@0,100;0,300;0,400;0,500;0,700;0,900;1,100;1,300;1,400;1,500;1,700;1,900&family=Work+Sans:ital,wght@0,100..900;1,100..900&display=swap" rel="stylesheet">
	<link rel="stylesheet" type="text/css" href="../build/potree/potree.css">
	<link rel="stylesheet" type="text/css" href="../libs/jquery-ui/jquery-ui.min.css">
	<link rel="stylesheet" type="text/css" href="../libs/openlayers3/ol.css">
	<link rel="stylesheet" type="text/css" href="../libs/spectrum/spectrum.css">
	<link rel="stylesheet" type="text/css" href="../libs/jstree/themes/mixed/style.css">
	<style>
		#potree_toolbar {
			position: absolute;
			z-index: 100;
			right: 0px;
			top: 0px;
			background: black;
			color: white;
			padding: 0.3em 0.8em;
			font-family: "system-ui";
			border-radius: 0em 0em 0.3em 0.3em;
			display: flex;
		}

		.potree_toolbar_label {
			text-align: center;
			font-size: smaller;
			width: 12em;
			opacity: 0.9;
		}
	</style>
</head>



<body>

	<script src="../libs/jquery/jquery-3.1.1.min.js"></script>
	<script src="../libs/spectrum/spectrum.js"></script>
	<script src="../libs/jquery-ui/jquery-ui.min.js"></script>
	<script src="../libs/three.js/build/three.min.js"></script>
	<script src="../libs/three.js/extra/lines.js"></script>
	<script src="../libs/other/BinaryHeap.js"></script>
	<script src="../libs/tween/tween.min.js"></script>
	<script src="../libs/d3/d3.js"></script>
	<script src="../libs/proj4/proj4.js"></script>
	<script src="../libs/openlayers3/ol.js"></script>
	<script src="../libs/i18next/i18next.js"></script>
	<script src="../libs/jstree/jstree.js"></script>
	<script src="../build/potree/potree.js"></script>
	<script src="../libs/plasio/js/laslaz.js"></script>


	<div class="potree_container" style="position: absolute; width: 100%; height: 100%; left: 0px; top: 0px; ">
		<div id="potree_description" class="potree_info_text" style="z-index: 100px; font-size: small; font-family: 'Work Sans', sans-serif;">
			Black and White Present Scans<br>
			<!-- <button id="jpgbtn">Object Photo</button> <br> -->
		</div>
		<!-- <div id="potree_sidebar_container" style="width: 300px; height: 100%; z-index:500px;">
</div> -->
		<div id="potree_render_area" style="background: rgb(243, 243, 243);"></div>
		<div id="potree_toolbar"
			style="position: absolute; z-index: 200; max-width: 50px; right: 100px; top: 0px; font-size: smaller; font-family: 'Work Sans' !important;">
			<span>
				<div class="potree_toolbar_label">
					Material
				</div>
				<div>
					<select id="optMaterial" name="optMaterial"></select>
				</div>
			</span>
		</div>
	</div>
	<div style="position: absolute;  z-index: 50; right: 0px; top: 70px;" id="jpg">
	</div>
	</div>

	<script> //Toggle image
		const jpg = document.getElementById("jpg");
		const btn = document.getElementById("jpgbtn");

		btn.addEventListener("click",
			function () {
				if (jpg.innerHTML === '<img src="https://potree-test2.s3.us-west-2.amazonaws.com/3DAtlas/objectphotos/checkeredpresent.jpg" style="width:400px">') {
					jpg.innerHTML = ''
				} else {
					jpg.innerHTML = '<img src="https://potree-test2.s3.us-west-2.amazonaws.com/3DAtlas/objectphotos/checkeredpresent.jpg" style="width:400px">'
				}
			});
	</script>

	<script>

		window.viewer = new Potree.Viewer(document.getElementById("potree_render_area"));

		viewer.loadGUI(() => {
			viewer.setLanguage('en');
			$("#menu_appearance").next().show();
			// viewer.toggleSidebar();
		});

		viewer.setEDLEnabled(true);
		viewer.setFOV(60);
		viewer.setPointBudget(4 * 1000 * 1000);
		viewer.loadSettingsFromURL();

		viewer.scene.view.position.set(2400, -3700, 2100);
		viewer.scene.view.lookAt(2250, 2000, 0);


		Potree.loadPointCloud("https://potree-test2.s3.us-west-2.amazonaws.com/3DAtlas/pointclouds/UCLA_BWPlaidPresent_Artec_converted/metadata.json", "Artec Space Spider").then(e => {
			viewer.scene.addPointCloud(e.pointcloud);

			let material = e.pointcloud.material;
			material.activeAttributeName = "classification";
			material.minSize = 2;
			material.pointSizeType = Potree.PointSizeType.ADAPTIVE;
			material.shape = Potree.PointShape.CIRCLE;

			e.pointcloud.scale.set(20, 20, 20);
			e.pointcloud.position.set(0, 0, 800);
			e.pointcloud.rotation.set(Math.PI * .07, Math.PI * 0, Math.PI * .3);

		});


		Potree.loadPointCloud("https://potree-test2.s3.us-west-2.amazonaws.com/3DAtlas/pointclouds/UCSF_plaidpresentscan-002_converted/metadata.json", "EinScan SP").then(e => {
			viewer.scene.addPointCloud(e.pointcloud);

			let material = e.pointcloud.material;
			material.activeAttributeName = "classification";
			material.minSize = 2;
			material.pointSizeType = Potree.PointSizeType.ADAPTIVE;
			material.shape = Potree.PointShape.CIRCLE;

			e.pointcloud.scale.set(20, 20, 20);
			e.pointcloud.position.set(1500, 0, 800);
			e.pointcloud.rotation.set(Math.PI * .055, Math.PI * 0, Math.PI * .225);
		});


		Potree.loadPointCloud("https://potree-test2.s3.us-west-2.amazonaws.com/3DAtlas/pointclouds/UCR_bw_present_converted/metadata.json", "EinScan Pro").then(e => {
			viewer.scene.addPointCloud(e.pointcloud);

			let material = e.pointcloud.material;
			material.activeAttributeName = "classification";
			material.minSize = 2;
			material.pointSizeType = Potree.PointSizeType.ADAPTIVE;
			material.shape = Potree.PointShape.CIRCLE;

			e.pointcloud.scale.set(20, 20, 20);
			e.pointcloud.rotation.set(Math.PI * .055, Math.PI * 0, Math.PI * .225);
			e.pointcloud.position.set(3000, 0, 800);


		});

		Potree.loadPointCloud("https://potree-test2.s3.us-west-2.amazonaws.com/3DAtlas/pointclouds/UCBEinscanSEBlackandwhitepresent_converted/metadata.json", "EinScan SE").then(e => {
			viewer.scene.addPointCloud(e.pointcloud);

			let material = e.pointcloud.material;
			material.activeAttributeName = "classification";
			material.minSize = 2;
			material.pointSizeType = Potree.PointSizeType.ADAPTIVE;
			material.shape = Potree.PointShape.CIRCLE;

			e.pointcloud.scale.set(20, 20, 20);
			e.pointcloud.rotation.set(Math.PI * .075, Math.PI * -.05, Math.PI * .19);
			e.pointcloud.position.set(4500, 0, 800);


		});

		let a1 = new Potree.Annotation({
			position: [-300, 0, 800],
			title: `Artec Space Spider`,
			description: "Scanning: 2 min. <br> Processing: 5 min. / 6 min. with texture <br> Software: Artec Studio 1v6 <br> Campus: UCLA",
		});
		viewer.scene.annotations.add(a1);

		let a2 = new Potree.Annotation({
			position: [1500, 0, 800],
			title: `EinScan SP`,
			description: "Scanning: 4 min.  28 sec. <br> Processing: 2 min. 24 sec. <br> Software: EX-Scan-S v3.1.2.0 <br> Campus: UCSF",
		});
		viewer.scene.annotations.add(a2);

		let a3 = new Potree.Annotation({
			position: [3000, 0, 800],
			title: `EinScan Pro`,
			description: "Scanning: 1 min. 21 sec. <br> Processing: 1 min. 27 sec. <br> Software: EinScan Pro <br> Campus: UCR",
		});

		viewer.scene.annotations.add(a3);


		let a4 = new Potree.Annotation({
			position: [4500, 0, 800],
			title: `EinScan SE`,
			description: "Scanning: 5 min. 37 sec. <br> Processing: 6 min. 23 sec. <br> Software: EinScan Mac v1.5.0 <br> Campus: UCB",
		});
		viewer.scene.annotations.add(a4);


		Potree.loadPointCloud("https://potree-test2.s3.us-west-2.amazonaws.com/3DAtlas/pointclouds/UCSC_BWPresent_EinscanPro2HD_converted/metadata.json", "EinScan Pro 2").then(e => {
			viewer.scene.addPointCloud(e.pointcloud);
			let pointcloud = e.pointcloud;


			let material = e.pointcloud.material;
			material.activeAttributeName = "classification";
			material.minSize = 2;
			material.pointSizeType = Potree.PointSizeType.ADAPTIVE;
			material.shape = Potree.PointShape.CIRCLE;

			e.pointcloud.scale.set(20, 20, 20);
			e.pointcloud.position.set(750, 0, -800);
			e.pointcloud.rotation.set(Math.PI * .07, Math.PI * 0, Math.PI * .3);

		});

		Potree.loadPointCloud("https://potree-test2.s3.us-west-2.amazonaws.com/3DAtlas/pointclouds/UCSC_BlackWhitePresent_EinscanPro2Color_converted/metadata.json", "EinScan Pro 2").then(e => {
			viewer.scene.addPointCloud(e.pointcloud);
			let pointcloud = e.pointcloud;


			let material = e.pointcloud.material;
			material.activeAttributeName = "classification";
			material.minSize = 2;
			material.pointSizeType = Potree.PointSizeType.ADAPTIVE;
			material.shape = Potree.PointShape.CIRCLE;

			e.pointcloud.scale.set(20, 20, 20);
			e.pointcloud.position.set(2250, 0, -800);
			e.pointcloud.rotation.set(Math.PI * .1, Math.PI * .01, Math.PI * .25);
		});


		Potree.loadPointCloud("https://potree-test2.s3.us-west-2.amazonaws.com/3DAtlas/pointclouds/UCSC_BlackWhitePresent_Photogrammetry_iPhone13_Meshroom_converted/metadata.json", "iPhone").then(e => {
			viewer.scene.addPointCloud(e.pointcloud);
			let material = e.pointcloud.material;
			material.activeAttributeName = "classification";
			material.minSize = 2;
			material.pointSizeType = Potree.PointSizeType.ADAPTIVE;
			material.shape = Potree.PointShape.CIRCLE;

			e.pointcloud.scale.set(2500, 2500, 2500);
			e.pointcloud.rotation.set(Math.PI * .2, Math.PI * .01, Math.PI * .25);
			e.pointcloud.position.set(3750, 0, -1100);

		});


		let a5 = new Potree.Annotation({
			position: [750, 0, -800],
			title: `EinScan Pro2 + HD`,
			description: "Scanning: 45 min.  <br> Processing: 2 min. <br> Software: EinScan Pro 2  <br> Campus: UCSC",
		});
		viewer.scene.annotations.add(a5);

		let a6 = new Potree.Annotation({
			position: [2250, 0, -800],
			title: `EinScan Pro2 + Color`,
			description: "Scanning: 50 min.  <br> Processing: 2 min. <br> Software: EinScan Pro 2  <br> Campus: UCSC",
		});
		viewer.scene.annotations.add(a6);

		let a7 = new Potree.Annotation({
			position: [3750, 0, -800],
			title: `iPhone`,
			description: "Software: photogrammetry via Meshroom <br> Camera: iPhone <br> Campus: UCSC",
		});
		viewer.scene.annotations.add(a7);



	</script>



	<script>

		const elToolbar = $("#potree_toolbar");
		{ // MATERIAL
			let options = [
				"grayscale",
				"color",
			];

			let attributeSelection = elToolbar.find('#optMaterial');
			for (let option of options) {
				let elOption = $(`<option>${option}</option>`);
				attributeSelection.append(elOption);
			}

			const updateMaterialSelection = (event, ui) => {

				if (attributeSelection.selectmenu().val() === "grayscale") {
					let selectedValue = "classification";

					for (const pointcloud of viewer.scene.pointclouds) {
						pointcloud.material.activeAttributeName = selectedValue;
					};
				}
				else {
					let selectedValue = "rgba";
					for (const pointcloud of viewer.scene.pointclouds) {
						pointcloud.material.activeAttributeName = selectedValue;
					};
				};
			};
			attributeSelection.selectmenu({ change: updateMaterialSelection });
		}
	</script>

</body>

</html>
