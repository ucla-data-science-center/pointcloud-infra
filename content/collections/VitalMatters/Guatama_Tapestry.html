<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Metadata -->
	<meta charset="utf-8"> <!-- Sets font -->
	<meta name="description" content="Potree Viewer">     
	<meta name="author" content="">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

	<title>Potree Viewer</title>
    <!-- Title that appears in the tab -->
	
    <!-- Stylesheets for editing HTML -->
	<link rel="stylesheet" type="text/css" href="../build/potree/potree.css">
	<link rel="stylesheet" type="text/css" href="../libs/jquery-ui/jquery-ui.min.css">
	<link rel="stylesheet" type="text/css" href="../libs/openlayers3/ol.css">
	<link rel="stylesheet" type="text/css" href="../libs/spectrum/spectrum.css">
	<link rel="stylesheet" type="text/css" href="../libs/jstree/themes/mixed/style.css">
</head>

<body>
    <!-- JavaScript files that add functionalities from outside this HTML -->
	<script src="../libs/jquery/jquery-3.1.1.min.js"></script>
	<script src="../libs/spectrum/spectrum.js"></script>
	<script src="../libs/jquery-ui/jquery-ui.min.js"></script>
	<script src="../libs/three.js/build/three.min.js"></script>
	<script src="../libs/three.js/extra/lines.js"></script>
	<script src="../libs/other/BinaryHeap.js"></script>
	<script src="../libs/tween/tween.min.js"></script>
	<script src="../libs/d3/d3.js"></script>
	<script src="../libs/proj4/proj4.js"></script>
	<script src="../libs/openlayers3/ol.js"></script>
	<script src="../libs/i18next/i18next.js"></script>
	<script src="../libs/jstree/jstree.js"></script>
	<script src="../build/potree/potree.js"></script>
	<script src="../libs/plasio/js/laslaz.js"></script>

    <!-- DIVs create the layout of the HTML -->
	<div class="potree_container" style="position: absolute; width: 100%; height: 100%; left: 0px; top: 0px; ">
		<div id="potree_render_area"></div>
		<div id="potree_sidebar_container"> </div>
	</div>

    <!-- The script tag opens JavaScript, where most of the viewer is generated by calling Potree JS file functions -->
	<script type="module">

		window.viewer = new Potree.Viewer(document.getElementById("potree_render_area")); //edits the potree_render_area 

        // The following are also adjustable from the sidebar
		viewer.setEDLEnabled(true); // Eye dome lighting
		viewer.setFOV(60); // Field of vision, Changing may mess with zoom
		viewer.setPointBudget(4 * 1000 * 1000); // Max points
		// viewer.setMinNodeSize(0);

		viewer.setDescription("Guatama"); // The text at the top of the page
		viewer.scene.view.position.set(347.525, -1445.761, 601.482); // Sets the camera position (our POV)
		viewer.scene.view.lookAt(423.234, 111.183, 700.446); // Sets the camera target

		viewer.loadSettingsFromURL();

		viewer.loadGUI().then(() => { //Loads sidebar
			viewer.setLanguage('en'); 
			$("#menu_appearance").next().show(); // Has the menu expanded when the sidebar opens
			// viewer.toggleSidebar(); // Include for the sidebar to be opened on load
		});

        
        //The next lines pertain to the pointcloud itself 
        Potree.loadPointCloud("https://potree-test2.s3.us-west-2.amazonaws.com/VitalMatters/Guatama_Tapestry/metadata.json", "Guatama Tapestry", function (e) {
            // First parameter loads the pointcloud in from the s3 bucket, second adjusts the title that appears in the sidebar

			viewer.scene.addPointCloud(e.pointcloud); // Adds pointcloud to scene, useful for toggling in more detailed viewers 

			// e.pointcloud.scale.set(); // Sets size 
			e.pointcloud.rotation.set(Math.PI * .0, Math.PI * .0, Math.PI * .0); // XYZ Rotation, adjust "".0" from 0.0-1.0
			e.pointcloud.position.set(0,0,0); // Pointcloud position

			let material = e.pointcloud.material; // Shortens variable
			material.activeAttributeName = "rgba"; // Material setting: classification, rgba...
			material.size = 0.66;  // Size of points
			material.pointSizeType = Potree.PointSizeType.ADAPTIVE;  // View of points
			material.shape = Potree.PointShape.CIRCLE;  // Shape of points
			// viewer.fitToScreen(); 


			// Define annotations
			const ann1 = new Potree.Annotation({
				position: new THREE.Vector3(268.44,128.06,596.27),
				title: "1",
				description: "Gautama Swami: Gautama Swami was the chief \
								disciple of Mahavira, 24 th and last supreme \
								preacher of Jainism, an ancient Indian religion. \
								One day, Mahavira told Gautama Swami that he \
								would achieve liberation (moksha) if he were \
								able to worship the jeweled images of the Jonas \
								(human beings who achieved omniscience and \
								taught other people the path of liberation from \
								the cycle of rebirth) atop Mt. Ashtapada. Using \
								his powers attained though the practice of yoga, \
								Gautama Swami immediately flew to the sacred \
								mountain and began his ascent."
			})

			const ann2 = new Potree.Annotation({
				position: new THREE.Vector3(412.42, 156.00, 194.77),
				title: "2",
				description: 'Eight Steps (Ashtapada): The mountain is \
								labled, "The Blessed [Shri] Ashtāpad-ji, which \
								means "Eight Steps," or giant terraces carved \
								into the rock by Bharata, son of the first Jina, \
								Rishabha. The steep structure was intended to \
								protect the jeweled images he installed atop the \
								mountain to commemorate where his father \
								passed into liberation (moksha) upon his death. \
								Only a person with the most advanced yogic \
								powers, attained through ascetic self-mastery, \
								could make it all the way to the top.'
			})

			const ann3 = new Potree.Annotation({
				position: new THREE.Vector3(568.14, 98.97, 622.10),
				title: "3",
				description: 'The Stairs of Ashtapada: Gautama Swami begins \
								his ascent but finds that he could not climb \
								above the third step. Here, we see the "eight \
								steps" of Ashtapada represented by 16 bars \
								arranged trapezoidally, showing both the riser \
								and the step of each stair.'
			})


			const ann4 = new Potree.Annotation({
				position: new THREE.Vector3(307.80, 108.29, 798.91),
				title: "4",
				description: "Using the Sun's Rays as Ropes"
			})

			const ann5 = new Potree.Annotation({
				position: new THREE.Vector3(429.14, 100.78, 745.59),
				title: "5",
				description: "Shrines for the 24 Jinas: The top of Mt. \
								Ashtapada houses 24 shrines with images of the \
								Jonas carved from precious gems. They were \
								created and installed by Bharata, the son of \
								Rishabha, the first Jina who attained liberation \
								atop this mountain. Bharata is the model Jain \
								layman: he built temples all over India, \
								especially at sites important to the ascetic career \
								of his father, including one at Shatrunjay, on the \
								Saurashtra Peninsula in the modern stat of \
								Gujarat. Here we see the Jinas represented in \
								order. Most of them (16) have golden bodies, two \
								are red, two white, two green, and two black (or \
								dark blue). Jains hold it to be an eternal truth \
								that exactly 24 Jinas appear in each work age to \
								reinvigorate the teachings about the path to \
								liberation and reminded people of their vital \
								messages."
			})


			const ann6 = new Potree.Annotation({
				position: new THREE.Vector3(478.71,103.31,596.12),
				title: "6",
				description: "Vaishramana: On the night when Gautam Swami \
								stayed atop the mountain, he was visited by the \
								god Vaishramana. An accomplished Jain monk \
								in a former life, he had been reborn as a deity.\
								Impressed with Gautam Swami's handsome \
								features (including pudgy belly!), he wondered \
								why the monk's body was not emaciated from \
								the many ascetic acts--such as fasting and yoga-- \
								that he must have performed to be able to \
								ascend the mountain. Gautam Swami, reading \
								Vaishraman’s mind, explained that asceticism \
								properly done does not wither the body but \
								rather helps one gain control of the Self (ātman) \
								and to master one's passions, such that the soul's \
								natural abilities can be unlocked."
			})

			const ann7 = new Potree.Annotation({
				position: new THREE.Vector3(450.22,118.45,497.95),
				title: "7",
				description: "Three Yogis: When Gautam Swami arrived at \
								Mt. Ashtapada, he observed three yogis (each \
								with 500 followers) practicing austerities (tapas) \
								in an attempt to ascend above the third step \
								(pada). Unable to do so, they were impressed by \
								Gautam's ability to summit the mountain by \
								means of his ascetic power (see #1). When \
								Gautama Swami’s returned from the top the next \
								day, everyone wanted to learn from him. He \
								insisted instead that they become disciples of \
								Mahavira instead, Gautama initiated all 1,503 \
								ascetics. Their story continues in #8, below and \
								to the left"
			})

			const ann8 = new Potree.Annotation({
				position: new THREE.Vector3(268.14,146.40,390.27),
				title: "8",
				description: "Breaking the Fast: The 1,503 ascetics had been \
								fasting or three days. Gautam Swami broke their \
								fast with the rice pudding in his own begging \
								bowl, using his ascetic powers to turn the \
								meager portion into enough for all. One group of \
								ascetics (501) was able to attain omniscience \
								(kevala jñāna), which Jains consider to be the \
								precondition for liberation (much the way \
								Buddhists regard “enlightenment” as the \
								precondition for attaining nirvana)- just from \
								breaking their fast with Gautam Swami’s help. A \
								second group attained omniscience just by \
								hearing his description of Mahavira. The third \
								group did so upon meeting Mahavira."
			})

			const ann9 = new Potree.Annotation({
				position: new THREE.Vector3(452.28,136.03,353.12),
				title: "9",
				description: "Lake at the Foot of Ashtapada: Another story \
								depicted on this panel (and unrelated to Gautam \
								Swami’s visit to Gautam Swami’s visit to \
								Ashtapada) recounts the origin of the lake at the \
								foot of the mountain. King Sāgara’s 60,000 sons \
								went on the pilgrimage to Ashtapada. Fearing \
								that the jeweled images of the Jonas would be \
								stolen in the ever worsening conditions of our \
								era, they decided to dig a moat around the \
								mountain. Their actions disturbed the king of \
								the serpents (nāgas) who livd under the \
								mountain. Forgiving the intruders for this \
								transgression for a while, he finally lost his \
								temper when they decided to fill the trench with \
								water from the Ganges River and burned them \
								all to ash by breathing fire on them. Learning \
								about his sons’ demise, King Sāgara realized that \
								futility of worldly life and renounced it to \
								become a monk in the sangha (pious \
								community) of the second Jina, Ajitnath."
			})

			const ann10 = new Potree.Annotation({
				position: new THREE.Vector3(338.66,124.16,604.42),
				title: "10",
				description: "Ravana: In the Jain world, Ravana, best known \
								as the ten-headed villain of the Hindu epic tale \
								Ramayana, was devoted to the Jinas (though he \
								later went astray). He wanted but was unable to \
								move Ashtapada because a Jain Monk named \
								Bali put his toe down on the mountain to hold it \
								in place. Impressed by the strength arising from \
								the monk's ascetic purity, Ravana would \
								undertake a a pilgrimage to the site, playing the \
								veena (a stringed instrument) while his wife \
								Mandodari danced to his music in honor of the \
								gods. When one of the strings broke, Ravana \
								pulled a vein out of his arm and used it as a \
								replacement. Due to this act of devotion, Ravana \
								attained karma and became a Jina."
			})

			const ann11 = new Potree.Annotation({
				position: new THREE.Vector3(379.56,118.25, 581.45),
				title: "11",
				description: "The Peak of Ashtapada: The peak of Mt. \
								Ashtapada, here shown as the spire of a Jain \
								temple. The image is a visual pun, as the word \
								for both &quot;peak&quot; and &quot;spire&quot; is &quot;shikhara.&quot; Jain \
								temples, like Hindu temples, are sacred \
								mountains, representing the center of the world. \
								Going to a temple is a journey to the essence of \
								all things: for Hindus, God, the source of all \
								creation; for Jains, the Jinas, those who embody \
								and teach the truth (dharma) of the universe. \
								Here, we see the shikhara has a flag affixed atop \
								it, just as we would expect to see atop a Jain \
								temple shikhara. A divine parasol hangs over the \
								peak, another symbol shared between royalty \
								and divinity, that here indicates the spiritual \
								sovereignty of the Jinas enshrined in this temple \
								mountain. The spire of the temple is adorned \
								with a crescent moon (center) and a dual &quot;fish \
								tail&quot; pattern, an auspicious symbol which may be \
								a stylized representation of the Jina's turban, a \
								nod to their pre-ascetic status as members of the \
								royal class (Kshatriyas)."
			})

			const ann12 = new Potree.Annotation({
				position: new THREE.Vector3(421.40,65.64,1123.69),
				title: "12",
				description: "The Sun: The sun (left) and moon (right) are \
								commonly shown in temples, on stele with \
								inscriptions, and are two of the fourteen (or \
								sixteen) dreams that each Jina's mother has \
								upon conceiving them. Together, they are \
								symbols of the eternal truth of what is presented. \
								Inscription stele, which chod patas emulate, \
								show them to state that the royal decrees set \
								forth in them should last &quot;as long as the sun and \
								moon may endure.&quot;"
			})

			const ann13 = new Potree.Annotation({
				position: new THREE.Vector3(347.66,80.77,1056.21),
				title: "13",
				description: "The Moon: The sun (left) and moon (right) are \
								commonly shown in temples, on stele with \
								inscriptions, and are two of the fourteen (or \
								sixteen) dreams that each Jina's mother has \
								upon conceiving them. Together, they are \
								symbols of the eternal truth of what is presented. \
								Inscription stele, which chod patas emulate, \
								show them to state that the royal decrees set \
								forth in them should last &quot;as long as the sun and \
								moon may endure.&quot;"
			})

			const ann14 = new Potree.Annotation({
				position: new THREE.Vector3(502.68,62.04,1060.44),
				title: "14",
				description: "Shikharas: Two smaller shikharas flank the main \
								peak/spire of this temple mountain. In western \
								India, Jain temples almost always have two \
								slightly smaller shikharas flanking a larger main \
								shikhara. The temple is a holy mountain with \
								multiple peaks, just as the temple has a main \
								Jina enshrined in it with other Jinas recognized \
								and enshrined alongside them. As Mt. \
								Ashtapada is the site where the first Jina, \
								Rishabhanatha or Adinatha (First Lord), \
								attained liberation (moksha), we would expect \
								him to find pride of place here among all 24 \
								Jinas of our world age."
			})

			const ann15 = new Potree.Annotation({
				position: new THREE.Vector3(508.92,71.67,980.03),
				title: "15",
				description: "Heavenly Attendants: Heavenly attendants wave \
								fly whisks (chowries), to honor the sacred \
								mountain, which is a &quot;crossing place&quot; (tīrtha) \
								between our world of death and rebirth \
								(sa sāra) and the ultimate end where all soulsṃ \
								go when they attain liberation (moksha). Even \
								heaven, while a meritorious birth and a \
								delightful place, is not a final end to suffering in \
								the cycle of death and rebirth. Even the gods \
								must eventually die and be reborn, making them \
								the ideal devotees of the Jinas."
			})

			const ann16 = new Potree.Annotation({
				position: new THREE.Vector3(284.39,89.99,1005.36),
				title: "16",
				description: "Lotuses and Creepers: Lotuses and creepers fill \
								the space in the corners. Lotuses are symbols of \
								spiritual transcendence, while the creepers are \
								symbols of goodness, abundance, and wish- \
								fulillment. The buds on the ends of the creepers \
								symbolize the potential for achieving our goals, \
								with liberation being the ultimate goal that we \
								should all strive to attain. (edited)"
			})

			const ann17 = new Potree.Annotation({
				position: new THREE.Vector3(611.50,47.31,1162.92),
				title: "17",
				description: "The Vegetal Pattern Border: The vegetal pattern \
								bordering this chod pata is a less common \
								decorative style among the chod patas in the \
								Linde collection. While it is relatively more \
								common to show the fourteen dreams of the Jina \
								mothers along the left and right margins of a \
								chod pata, a floral or vegetal pattern, as seen \
								here, is also common. The choice of border here \
								may be purely stylistic, either on the part of the \
								person who commissioned it or left to the \
								maker's discretion."
			})

			const ann18 = new Potree.Annotation({
				position: new THREE.Vector3(762.48,20.21,1304.47),
				title: "18",
				description: "Inscription: Most chod patas include \
								inscriptions on the bottom that explain why it \
								was commissioned. Here, we learn that Rajubai, \
								the wife of Nemchand, resident of a Mumbai \
								neighborhood, completed a lengthy fast on \
								January 28, 1961. The specific fast she \
								performed is modeled after the story depicted above."
			})

			const ann19 = new Potree.Annotation({
				position: new THREE.Vector3(406.62,170.26,80.72),
				title: "19",
				description: "Incription: 2nd line: udyāpan nimitte. mu. bār sī \
								sa[mvat] (2017=1960-1 CE). Inscription: 1st line: a[khanda] sau[bhāgyavatī]\
								Rājubāi bhra.(i.e., bhāryā) Nemccand Baldo ā-ṭānā. \
								Rajubai, wife of Nemichand, of Baldota, \
								Mumbai, whose goal (i.e., a fast) was completed, \
								on the 12th of the bright half [of Mahā/Māgh?] \
								(i.e., Jan. 28, 1961)."
			})



			viewer.scene.annotations.add(ann1);
			viewer.scene.annotations.add(ann2);
			viewer.scene.annotations.add(ann3);
			viewer.scene.annotations.add(ann4);
			viewer.scene.annotations.add(ann5);
			viewer.scene.annotations.add(ann6);
			viewer.scene.annotations.add(ann7);
			viewer.scene.annotations.add(ann8);
			viewer.scene.annotations.add(ann9);
			viewer.scene.annotations.add(ann10);
			viewer.scene.annotations.add(ann11);
			viewer.scene.annotations.add(ann12);
			viewer.scene.annotations.add(ann13);
			viewer.scene.annotations.add(ann14);
			viewer.scene.annotations.add(ann15);
			viewer.scene.annotations.add(ann16);
			viewer.scene.annotations.add(ann17);
			viewer.scene.annotations.add(ann18);
			viewer.scene.annotations.add(ann19);
			console.log('Annotations added to Jain tapestry:', viewer.scene.annotations.children.length);







		});
	</script>

</body>

</html>
