<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Metadata -->
	<meta charset="utf-8"> <!-- Sets font -->
	<meta name="description" content="Potree Viewer">     
	<meta name="author" content="">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

	<title>Potree Viewer</title>
    <!-- Title that appears in the tab -->
	
    <!-- Stylesheets for editing HTML -->
	<link rel="stylesheet" type="text/css" href="../build/potree/potree.css">
	<link rel="stylesheet" type="text/css" href="../libs/jquery-ui/jquery-ui.min.css">
	<link rel="stylesheet" type="text/css" href="../libs/openlayers3/ol.css">
	<link rel="stylesheet" type="text/css" href="../libs/spectrum/spectrum.css">
	<link rel="stylesheet" type="text/css" href="../libs/jstree/themes/mixed/style.css">
</head>

<body>
    <!-- JavaScript files that add functionalities from outside this HTML -->
	<script src="../libs/jquery/jquery-3.1.1.min.js"></script>
	<script src="../libs/spectrum/spectrum.js"></script>
	<script src="../libs/jquery-ui/jquery-ui.min.js"></script>
	<script src="../libs/three.js/build/three.min.js"></script>
	<script src="../libs/three.js/extra/lines.js"></script>
	<script src="../libs/other/BinaryHeap.js"></script>
	<script src="../libs/tween/tween.min.js"></script>
	<script src="../libs/d3/d3.js"></script>
	<script src="../libs/proj4/proj4.js"></script>
	<script src="../libs/openlayers3/ol.js"></script>
	<script src="../libs/i18next/i18next.js"></script>
	<script src="../libs/jstree/jstree.js"></script>
	<script src="../build/potree/potree.js"></script>
	<script src="../libs/plasio/js/laslaz.js"></script>

    <!-- DIVs create the layout of the HTML -->
	<div class="potree_container" style="position: absolute; width: 100%; height: 100%; left: 0px; top: 0px; ">
		<div id="potree_render_area"></div>
		<div id="potree_sidebar_container"> </div>
	</div>

    <!-- The script tag opens JavaScript, where most of the viewer is generated by calling Potree JS file functions -->
	<script type="module">

		window.viewer = new Potree.Viewer(document.getElementById("potree_render_area")); //edits the potree_render_area 

        // The following are also adjustable from the sidebar
		viewer.setEDLEnabled(true); // Eye dome lighting
		viewer.setFOV(60); // Field of vision, Changing may mess with zoom
		viewer.setPointBudget(4 * 1000 * 1000); // Max points
		// viewer.setMinNodeSize(0);

		viewer.setDescription("Wixarika"); // The text at the top of the page
		viewer.scene.view.position.set(140.738, -419.425, 1561.039); // Sets the camera position (our POV)
		viewer.scene.view.lookAt(516.999, 420.870, 609.749); // Sets the camera target

		viewer.loadSettingsFromURL();

		viewer.loadGUI().then(() => { //Loads sidebar
			viewer.setLanguage('en'); 
			$("#menu_appearance").next().show(); // Has the menu expanded when the sidebar opens
			// viewer.toggleSidebar(); // Include for the sidebar to be opened on load
		});

        
        //The next lines pertain to the pointcloud itself 
		Potree.loadPointCloud("https://potree-test2.s3.us-west-2.amazonaws.com/VitalMatters/Yarn/metadata.json", "Pointcloud Title", function (e) {
            // First parameter loads the pointcloud in from the s3 bucket, second adjusts the title that appears in the sidebar

			viewer.scene.addPointCloud(e.pointcloud); // Adds pointcloud to scene, useful for toggling in more detailed viewers 

			// e.pointcloud.scale.set(); // Sets size 
			e.pointcloud.rotation.set(Math.PI * .0, Math.PI * .0, Math.PI * .0); // XYZ Rotation, adjust "".0" from 0.0-1.0
			e.pointcloud.position.set(0,0,0); // Pointcloud position

			let material = e.pointcloud.material; // Shortens variable
			material.activeAttributeName = "rgba"; // Material setting: classification, rgba...
			material.size = 0.66;  // Size of points
			material.pointSizeType = Potree.PointSizeType.ADAPTIVE;  // View of points
			material.shape = Potree.PointShape.CIRCLE;  // Shape of points
			// viewer.fitToScreen(); 
			
			const ann1 = new Potree.Annotation({
                position: new THREE.Vector3(181.48, 436.34, 177.68),
                title: "1",
				description: "Snake (kúu): Snakes in Wixárika cosmology are often associated with rivers and waterways. In this composition, the artist depicts snakes against brown and blue backgrounds, possibly indicating their habitat as mud or water, respectively."
            });
			const ann2 = new Potree.Annotation({
                position: new THREE.Vector3(676.71, 475.06, 557.05),
                title: "2",
				description: "Deer (maxa): In Wixárika cosmology, deer are sacred beings in the animal world; they are seen as “elder brothers” who translate messages from the Ancestors so that humans can understand them, care for crops, offer spiritual guidance, and provide inspiration. Deer represent a source of prosperity and are deeply linked to corn and peyote."
            });
			const ann3 = new Potree.Annotation({
                position: new THREE.Vector3(601.82, 509.35, 536.44),
                title: "3",
				description: "Blue Deer (tamatsi maxayuawi): Blue Deer is a guiding spirit of the Wixaritari. He is known for transforming into a peyote cactus, a sacred plant consumed for visionary, divinatory, and medicinal purposes."
            });
			const ann4 = new Potree.Annotation({
                position: new THREE.Vector3(429.43, 334.37, 254.20),
                title: "4",
				description: "Peyote (hikuri): This low-lying cactus endemic to Chihuahuan desert is sacred in Wixárika culture, and is related to the corn and deer. It is often consumed during Wixarika ceremonies to foster connection with the Ancestors."
            });
			const ann5 = new Potree.Annotation({
                position: new THREE.Vector3(582.63, 714.18, 713.66),
                title: "5",
				description: "Words: In Wixárika yarn paintings, words are often symbolically rendered as dots emerging from the mouths of the figures."
            });
			const ann6 = new Potree.Annotation({
                position: new THREE.Vector3(431.93, 661.03, 558.53),
                title: "6",
				description: "Deer Antlers: In art and ritual, deer antlers not only represent Our Elder Brother Deer, but also channel the powers associated with him. Deer antlers can be found on different figures, both human and animal; and form sacred elements of altars and offerings."
            });
			const ann7 = new Potree.Annotation({
                position: new THREE.Vector3(728.23, 136.09, 280.48),
                title: "7",
				description: "Eagle (werika): The eagle is often depicted alongside other animals and insects valued in Wixárika culture. The eagle is sometimes related to Tatei Werika Wimari, Our Mother Eagle, a divine Ancestor who created the sky and travels across different sacred places."
            });
			const ann8 = new Potree.Annotation({
                position: new THREE.Vector3(493.39, 397.44, 339.11),
                title: "8",
				description: "Arrow (muwieri): Sacred plumed arrows, like the ones depicted here pointing to the ground, are used for healing and deposited as offerings in sacred places. Arrow-like prayer wands channel supernatural energy when wielded by shamans. Often tucked into their hats or headbands, these tools are used for divination and healing, among other rituals."
            });
			const ann9 = new Potree.Annotation({
                position: new THREE.Vector3(837.48, 284.97, 491.13),
                title: "9",
				description: "Sacred mountain peaks (kakauyarite): Canyons, rocks, and peaks are believed to be petrified Ancestors; they are often sacred and related to different aspects of the Wixarika cosmography."
            });
			const ann10 = new Potree.Annotation({
                position: new THREE.Vector3(428.14, 578.76, 479.84),
                title: "10",
				description: "Inscription: The inscription by the artist José Benítez Sánchez on the back of his yarn painting has been transcribed and translated as follows: Transcription: Los dioses vinieron a entregar su vida en el segundo mundo donde nacieron. Los dioses así dieron a conocer a todo los dioses en donde se encuentran todos los poderes de los antepasados que dieron a conocer los tres mundos: Tsuutua (punto de inicio), el primer mundo; Ixuapa (?), el centro del mundo; Wirikuta y Tserieta (?) en el sur y la Madre Lluvia; Hauxa Manaká en el norte en Durango donde se conoció el nierika, la vista de los dioses donde se encuentran los rostros de los tres mundos."
            });
			const ann11 = new Potree.Annotation({
				position: new THREE.Vector3(387.73, 606.93, 477.40),
				title: "11",
				description: "English translation: The Gods came to interweave their lives in the second world where they were born. In this way, they came to provide knowledge about everything; it was seen where all of the powers of the Ancestors were given in order to provide knowledge about the three worlds: Tsuutua (point of departure), the first world; Ixuapa (?), the center of the world; Wirikuta to the east and Tserieta (?) to the south, Mother of Rain; Hauxa Manaká in the north of Durango, where the nierika was first known – and the sight of the gods is found in the faces of the three worlds."
			});

			viewer.scene.annotations.add(ann1);
			viewer.scene.annotations.add(ann2);
			viewer.scene.annotations.add(ann3);
			viewer.scene.annotations.add(ann4);
			viewer.scene.annotations.add(ann5);
			viewer.scene.annotations.add(ann6);
			viewer.scene.annotations.add(ann7);
			viewer.scene.annotations.add(ann8);
			viewer.scene.annotations.add(ann9);
			viewer.scene.annotations.add(ann10);
			viewer.scene.annotations.add(ann11);
		});
	</script>

</body>

</html>
