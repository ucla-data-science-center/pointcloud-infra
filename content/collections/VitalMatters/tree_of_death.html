<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Metadata -->
	<meta charset="utf-8"> <!-- Sets font -->
	<meta name="description" content="Potree Viewer">     
	<meta name="author" content="">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

	<title>Potree Viewer</title>
    <!-- Title that appears in the tab -->
	
    <!-- Stylesheets for editing HTML -->
	<link rel="stylesheet" type="text/css" href="../build/potree/potree.css">
	<link rel="stylesheet" type="text/css" href="../libs/jquery-ui/jquery-ui.min.css">
	<link rel="stylesheet" type="text/css" href="../libs/openlayers3/ol.css">
	<link rel="stylesheet" type="text/css" href="../libs/spectrum/spectrum.css">
	<link rel="stylesheet" type="text/css" href="../libs/jstree/themes/mixed/style.css">
</head>

<body>
    <!-- JavaScript files that add functionalities from outside this HTML -->
	<script src="../libs/jquery/jquery-3.1.1.min.js"></script>
	<script src="../libs/spectrum/spectrum.js"></script>
	<script src="../libs/jquery-ui/jquery-ui.min.js"></script>
	<script src="../libs/three.js/build/three.min.js"></script>
	<script src="../libs/three.js/extra/lines.js"></script>
	<script src="../libs/other/BinaryHeap.js"></script>
	<script src="../libs/tween/tween.min.js"></script>
	<script src="../libs/d3/d3.js"></script>
	<script src="../libs/proj4/proj4.js"></script>
	<script src="../libs/openlayers3/ol.js"></script>
	<script src="../libs/i18next/i18next.js"></script>
	<script src="../libs/jstree/jstree.js"></script>
	<script src="../build/potree/potree.js"></script>
	<script src="../libs/plasio/js/laslaz.js"></script>

    <!-- DIVs create the layout of the HTML -->
	<div class="potree_container" style="position: absolute; width: 100%; height: 100%; left: 0px; top: 0px; ">
		<div id="potree_render_area"></div>
		<div id="potree_sidebar_container"> </div>
	</div>

    <!-- The script tag opens JavaScript, where most of the viewer is generated by calling Potree JS file functions -->
	<script type="module">

		window.viewer = new Potree.Viewer(document.getElementById("potree_render_area")); //edits the potree_render_area 

        // The following are also adjustable from the sidebar
		viewer.setEDLEnabled(true); // Eye dome lighting
		viewer.setFOV(60); // Field of vision, Changing may mess with zoom
		viewer.setPointBudget(4 * 1000 * 1000); // Max points
		// viewer.setMinNodeSize(0);

		viewer.setDescription("Tree of Death"); // The text at the top of the page
		viewer.scene.view.position.set(-328.260, -421.899, 1010.138); // Sets the camera position (our POV)
		viewer.scene.view.lookAt(320.441, 346.026, 372.922); // Sets the camera target

		viewer.loadSettingsFromURL();

		viewer.loadGUI().then(() => { //Loads sidebar
			viewer.setLanguage('en'); 
			$("#menu_appearance").next().show(); // Has the menu expanded when the sidebar opens
			// viewer.toggleSidebar(); // Include for the sidebar to be opened on load
		});

        
        //The next lines pertain to the pointcloud itself 
		Potree.loadPointCloud("https://potree-test2.s3.us-west-2.amazonaws.com/VitalMatters/Tree_of_Death/metadata.json", "Pointcloud Title", function (e) {
            // First parameter loads the pointcloud in from the s3 bucket, second adjusts the title that appears in the sidebar

			viewer.scene.addPointCloud(e.pointcloud); // Adds pointcloud to scene, useful for toggling in more detailed viewers 

			// e.pointcloud.scale.set(); // Sets size 
			e.pointcloud.rotation.set(Math.PI * .0, Math.PI * .0, Math.PI * .0); // XYZ Rotation, adjust "".0" from 0.0-1.0
			e.pointcloud.position.set(0,0,0); // Pointcloud position

			let material = e.pointcloud.material; // Shortens variable
			material.activeAttributeName = "rgba"; // Material setting: classification, rgba...
			material.size = 0.66;  // Size of points
			material.pointSizeType = Potree.PointSizeType.ADAPTIVE;  // View of points
			material.shape = Potree.PointShape.CIRCLE;  // Shape of points
			// viewer.fitToScreen(); 

			const ann1 = new Potree.Annotation({
                position: new THREE.Vector3(471.58, 478.01, 763.99),
                title: "1",
				description: "The Moon Goddess Coyolxauhqui: Coyolxauhqui – the Aztec goddess of the Moon – was mutilated by her brothers, led by the god of war Huitzilopochtli, the patron deity of the Aztec Empire, because they feared that she might produce children who would threaten their power. Coyolxauhqui’s story was depicted in a relief stone discovered at the Templo Mayor (Main Temple) at the Aztec capital Tenochtitlan in Mexico City. This relief stone was the model for Castillo’s depiction. Coyolxauhqui literally translates as “bells her cheeks”; Veronica Castillo added bells to the depiction of the goddess’ face to identify her."
            });

			const ann2 = new Potree.Annotation({
                position: new THREE.Vector3(232.71, 254.72, 260.21),
                title: "2",
				description: "The Factory ASARCO: ASARCO was the first factory to open on the border between Juárez, Mexico, and El Paso, U.S. It was also the first factory in the area that started to contaminate the environment with acids, lead, and other pollutants harmful to nature and people. It was the mother of the beginning of evil, says the artist."
            });
			const ann3 = new Potree.Annotation({
                position: new THREE.Vector3(214.20, 206.77, 227.48),
                title: "3",
				description: "Names of Factories on the Bottom of the Tree of Death: After ASARCO, other factories began to open in the area: SONY, PANASONIC, HRC. The artist included their names at the bottom of the tree above the closed factory doors before which the four anonymous and innocent girls stand."
            });
			const ann4 = new Potree.Annotation({
                position: new THREE.Vector3(122.31, 130.94, 234.85),
                title: "4",
				description: "Girls on the Roulette of Death: Like the game of chance called the Russian Roulette, work at the border factories turned into a deadly gamble for the women of Juárez; they needed income to survive, yet these jobs often led to their death. The artist showed four girls, faceless, but with long hair reflective of their youth and innocence, standing on a roulette before the factory building at the bottom of the tree. Their hands are empty because they always earn so little, their work only benefitting the factory owners."
            });
			const ann5 = new Potree.Annotation({
                position: new THREE.Vector3(74.16, 167.86, 218.61),
                title: "5",
				description: "Skulls: These five skulls projecting from the base of the tree represent the evils of globalization: capitalism, imperialism, the Free Trade Agreement, ambition, and power. They are the deadly forces that drive innocent girls and women to the factories, and rob them of their lives."
            });
			const ann6 = new Potree.Annotation({
                position: new THREE.Vector3(306.12, 94.59, 194.04),
                title: "6",
				description: "Tires: Murderers used tires to burn the mutilated women of Juárez, thus containing the flames. They became grim symbols of murder."
            });
			const ann7 = new Potree.Annotation({
                position: new THREE.Vector3(262.04, 482.18, 541.36),
                title: "7",
				description: "Clothes: Dresses and shoes were often the only remnants of the murdered women and a way to identify them. They hang from the tree as cruel ornaments, accompanied by mutilated body parts suspended from the branches."
            });
			const ann8 = new Potree.Annotation({
                position: new THREE.Vector3(312.05, 363.43, 496.88),
                title: "8",
				description: "Crosses: The crosses in this image represent the quest for justice for the victims of horrendous crimes against women. They are symbols of their martyrdom and hope for their vindication."
            });
			const ann9 = new Potree.Annotation({
                position: new THREE.Vector3(443.36, 177.74, 488.61),
                title: "9",
				description: "Four Men: They were the ones caught for crimes against women and brought to justice. They were called - and are labeled - El Diablo (The Devil), El Egipcio (The Egyptian), Dracula, and El Tolteca (The Toltec Man). However, their arrest and imprisonment did not stop the murders of factory girls and women, and the majority of other criminals have not been brought to justice."
            });
			const ann10 = new Potree.Annotation({
                position: new THREE.Vector3(247.06, 409.69, 421.91),
                title: "10",
				description: "Four Men: They were the ones caught for crimes against women and brought to justice. They were called - and are labeled - El Diablo (The Devil), El Egipcio (The Egyptian), Dracula, and El Tolteca (The Toltec Man). However, their arrest and imprisonment did not stop the murders of factory girls and women, and the majority of other criminals have not been brought to justice."
            });
			const ann11 = new Potree.Annotation({
                position: new THREE.Vector3(105.70, 398.74, 298.56),
                title: "11",
				description: "Four Men: They were the ones caught for crimes against women and brought to justice. They were called - and are labeled - El Diablo (The Devil), El Egipcio (The Egyptian), Dracula, and El Tolteca (The Toltec Man). However, their arrest and imprisonment did not stop the murders of factory girls and women, and the majority of other criminals have not been brought to justice."
            });
			const ann12 = new Potree.Annotation({
                position: new THREE.Vector3(391.23, 152.64, 306.52),
                title: "12",
				description: "Four Men: They were the ones caught for crimes against women and brought to justice. They were called - and are labeled - El Diablo (The Devil), El Egipcio (The Egyptian), Dracula, and El Tolteca (The Toltec Man). However, their arrest and imprisonment did not stop the murders of factory girls and women, and the majority of other criminals have not been brought to justice."
            });
			const ann13 = new Potree.Annotation({
                position: new THREE.Vector3(407.57, 443.34, 656.59),
                title: "13",
				description: "The Blindfolded Skull: This skull suggests that justice is dead and blind: it closes its eyes on the plight of the poor and the powerless; it is not there for the murdered women and their families, as most perpetrators have not been found, captured, tried, and imprisoned."
            });
			const ann14 = new Potree.Annotation({
                position: new THREE.Vector3(9398.65, 146.44, 400.31),
                title: "14",
				description: "The Color Red: This color of blood is also, for the artist, a way to say “Stop! Think! Change this way of life that is not just and harmful to women!”"
            });
			const ann15 = new Potree.Annotation({
                position: new THREE.Vector3(358.46, 391.10, 570.69),
                title: "15",
				description: "The Heart with Three Daggers: A skeletal hand holds the heart pierced by three daggers, which symbolize painful injustice. One dagger’s stab alludes to society forgetting about the poor. Another stands for the fact that the poor receive no justice, so the murder of the factory women is largely ignored. The third dagger points to the innocence of the victims and their families - they do not deserve their suffering."
            });
			const ann16 = new Potree.Annotation({
				position: new THREE.Vector3(471.29, 188.05, 575.35),
				title: "16",
				description: "Arch of Marigold Flowers: Marigolds, used in the Day of the Dead ceremonies, have been part of commemoration of the departed since Aztec times: their distinctive scent helped the spirits of the deceased to find their way back to their living relatives. For the artist, these flowers also represent eternal energy of the murdered girls and women of Juárez and of their grieving mothers. Marigolds frame the tree, enclosing the girls in a protective embrace, and symbolically safeguarding their memory. Finally, the artist sees this pictorial device as a call to keep fighting for justice and stop these crimes from happening."
			});

			viewer.scene.annotations.add(ann1);
			viewer.scene.annotations.add(ann2);
			viewer.scene.annotations.add(ann3);
			viewer.scene.annotations.add(ann4);
			viewer.scene.annotations.add(ann5);
			viewer.scene.annotations.add(ann6);
			viewer.scene.annotations.add(ann7);
			viewer.scene.annotations.add(ann8);
			viewer.scene.annotations.add(ann9);
			viewer.scene.annotations.add(ann10);
			viewer.scene.annotations.add(ann11);
			viewer.scene.annotations.add(ann12);
			viewer.scene.annotations.add(ann13);
			viewer.scene.annotations.add(ann14);
			viewer.scene.annotations.add(ann15);
			viewer.scene.annotations.add(ann16);

		});
	</script>

</body>

</html>
