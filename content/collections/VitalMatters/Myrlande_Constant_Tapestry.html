<!DOCTYPE html>
<html lang="en">

<head>
    <!-- Metadata -->
	<meta charset="utf-8"> <!-- Sets font -->
	<meta name="description" content="Potree Viewer">     
	<meta name="author" content="">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">

	<title>Potree Viewer</title>
    <!-- Title that appears in the tab -->
	
    <!-- Stylesheets for editing HTML -->
	<link rel="stylesheet" type="text/css" href="../build/potree/potree.css">
	<link rel="stylesheet" type="text/css" href="../libs/jquery-ui/jquery-ui.min.css">
	<link rel="stylesheet" type="text/css" href="../libs/openlayers3/ol.css">
	<link rel="stylesheet" type="text/css" href="../libs/spectrum/spectrum.css">
	<link rel="stylesheet" type="text/css" href="../libs/jstree/themes/mixed/style.css">
</head>

<body>
    <!-- JavaScript files that add functionalities from outside this HTML -->
	<script src="../libs/jquery/jquery-3.1.1.min.js"></script>
	<script src="../libs/spectrum/spectrum.js"></script>
	<script src="../libs/jquery-ui/jquery-ui.min.js"></script>
	<script src="../libs/three.js/build/three.min.js"></script>
	<script src="../libs/three.js/extra/lines.js"></script>
	<script src="../libs/other/BinaryHeap.js"></script>
	<script src="../libs/tween/tween.min.js"></script>
	<script src="../libs/d3/d3.js"></script>
	<script src="../libs/proj4/proj4.js"></script>
	<script src="../libs/openlayers3/ol.js"></script>
	<script src="../libs/i18next/i18next.js"></script>
	<script src="../libs/jstree/jstree.js"></script>
	<script src="../build/potree/potree.js"></script>
	<script src="../libs/plasio/js/laslaz.js"></script>

    <!-- DIVs create the layout of the HTML -->
	<div class="potree_container" style="position: absolute; width: 100%; height: 100%; left: 0px; top: 0px; ">
		<div id="potree_render_area"></div>
		<div id="potree_sidebar_container"> </div>
	</div>

    <!-- The script tag opens JavaScript, where most of the viewer is generated by calling Potree JS file functions -->
	<script type="module">

		window.viewer = new Potree.Viewer(document.getElementById("potree_render_area")); //edits the potree_render_area 

        // The following are also adjustable from the sidebar
		viewer.setEDLEnabled(true); // Eye dome lighting
		viewer.setFOV(60); // Field of vision, Changing may mess with zoom
		viewer.setPointBudget(4 * 1000 * 1000); // Max points
		// viewer.setMinNodeSize(0);

		viewer.setDescription("Myrlande Constant Tapestry"); // The text at the top of the page
		viewer.scene.view.position.set(1266.199, -2610.072, 1266.200); // Sets the camera position (our POV)
		viewer.scene.view.lookAt(1266.199, 1266.199, 1266.199); // Sets the camera target

		viewer.loadSettingsFromURL();

		viewer.loadGUI().then(() => { //Loads sidebar
			viewer.setLanguage('en'); 
			$("#menu_appearance").next().show(); // Has the menu expanded when the sidebar opens
			// viewer.toggleSidebar(); // Include for the sidebar to be opened on load
		});

        
        //The next lines pertain to the pointcloud itself 
		Potree.loadPointCloud("https://potree-test2.s3.us-west-2.amazonaws.com/VitalMatters/Myrlande_Constant_Tapestry/metadata.json", "Myrlande Constant Tapestry", function (e) {
            // First parameter loads the pointcloud in from the s3 bucket, second adjusts the title that appears in the sidebar

			viewer.scene.addPointCloud(e.pointcloud); // Adds pointcloud to scene, useful for toggling in more detailed viewers 

			// e.pointcloud.scale.set(); // Sets size 
			e.pointcloud.rotation.set(Math.PI * .0, Math.PI * .0, Math.PI * .0); // XYZ Rotation, adjust "".0" from 0.0-1.0
			e.pointcloud.position.set(0,0,0); // Pointcloud position

			let material = e.pointcloud.material; // Shortens variable
			material.activeAttributeName = "rgba"; // Material setting: classification, rgba...
			material.size = 0.66;  // Size of points
			material.pointSizeType = Potree.PointSizeType.ADAPTIVE;  // View of points
			material.shape = Potree.PointShape.CIRCLE;  // Shape of points
			// viewer.fitToScreen(); 

			console.log('Point cloud loaded, bounding box:', e.pointcloud.boundingBox);

			// Define Annotations
			const ann1 = new Potree.Annotation({
				position: new THREE.Vector3(1426.03, 310.88, 1442.69),
				title: "1",
				description: "Lwa are spirits in Haitian Vodou religion; they are seen as intermediaries \
								between humans and Bondye, the all-powerful creator God. “The lwa are \
								often passed down through generations and those who serve them may \
								speak of them as familiars, or elders, as they are considered like family,” say \
								curators Smith and Philogene. In this work, three lwa represented in the \
								center—Bawon Samdi, Grann Brijit, and Gede—are associated with death, \
								and are crucial to the scene of destruction caused by the horrific Haiti \
								earthquake of 2010."
			});

			const ann2 = new Potree.Annotation({
				position: new THREE.Vector3(1203.81, 316.55, 1316.66),
				title: "2",
				description: '&ldquo;Bawon Samdi is the male lwa of the dead, guardian of dead souls in Vodou,&rdquo; \
								says Philogene. He is recognized as the first man buried in a cemetery. In \
								this work, Bawon Samdi—the skeleton-faced figure dressed in a black tuxedo \
								at the center of the scene—kneels and tips his hat to honor the dead. \
								Together with his companion Brijit, he attends to the victims of the \
								earthquake.'
			});

			const ann3 = new Potree.Annotation({
				position: new THREE.Vector3(1301.28,280.27,1566.68),
				title: "3",
				description: "Grann Brijit, the female lwa who also protects the dead, and is a counterpart \
								to Bawon Samdi, is honored as the first woman buried in a cemetery. In this \
								panel, she is shown in a dazzling purple dress with white trim and white hat, \
								standing to the right of Bawon Samdi. Her splendid attire, however, does not \
								take away from the grief both lwa feel at the suffering people all around \
								them."
			})

			const ann4 = new Potree.Annotation({
				position: new THREE.Vector3(1578.78,341.88,1332.51),
				title: "4",
				description: "Gede: This family of trickster deities, operating under the direction of \
								Bawon Samdi and Grann Brijit, straddles life and death. They are keepers of \
								cemeteries as well as spirits of sexuality, affirming life amid death. They can \
								be humorous and scandalously irreverent truth-tellers; as well as powerful \
								healers."
			})

			const ann5 = new Potree.Annotation({
				position: new THREE.Vector3(509.65, 178.32, 1873.88),
				title: "5",
				description: "Tablet: Constant placed the text explaining this work in the top left corner, \
								on the tablets that recall those given to Moses by God in the Bible’s Old \
								Testament.The inscription states in Haitian Creole: “Gad la pèn. Nou pa ka \
								kontrole konbyen milye de kadav moun ki mouri et disparét…mardi 12 \
								janvye 2010 a…sa se te yon gqo moman térib” (Look at the pain. We can’t \
								control how many thousands of the bodies died or disappeared… on \
								Tuesday, January 12, 2010 at… it was a major horrible moment).” The \
								tablets turn the scene into an event imbued with religious importance."
			})

			const ann6 = new Potree.Annotation({
				position: new THREE.Vector3(782.04,247.24,1602.11),
				title: "6",
				description: "Church of God: According to Constant, Eglise De Dieu (Church of God) \
								represents Protestantism in Haiti. She was adamant that Protestantism, \
								Catholicism, and Vodou be present in this work because the 2010 \
								earthquake impacted everyone, regardless of their faith. The loss of life and \
								suffering were universal, as her densely packed depiction of the calamity \
								makes painfully clear."
			})

			// Make annotations visible
			console.log('Adding annotations...');
			viewer.scene.annotations.add(ann1);
			viewer.scene.annotations.add(ann2);
			viewer.scene.annotations.add(ann3);
			viewer.scene.annotations.add(ann4);
			viewer.scene.annotations.add(ann5);
			viewer.scene.annotations.add(ann6);
			console.log('Annotations added:', viewer.scene.annotations.children.length);


		});
	</script>

</body>

</html>
