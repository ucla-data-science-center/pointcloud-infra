<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<meta name="description" content="">
	<meta name="author" content="">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
	<title>Faces Revealed</title>

	<link rel="stylesheet" type="text/css" href="../build/potree/potree.css">
	<link rel="stylesheet" type="text/css" href="../libs/jquery-ui/jquery-ui.min.css">
	<link rel="stylesheet" type="text/css" href="../libs/openlayers3/ol.css">
	<link rel="stylesheet" type="text/css" href="../libs/spectrum/spectrum.css">
	<link rel="stylesheet" type="text/css" href="../libs/jstree/themes/mixed/style.css">
</head>

<body>
	<script src="../libs/jquery/jquery-3.1.1.min.js"></script>
	<script src="../libs/spectrum/spectrum.js"></script>
	<script src="../libs/jquery-ui/jquery-ui.min.js"></script>
	<script src="../libs/three.js/build/three.min.js"></script>
	<script src="../libs/three.js/extra/lines.js"></script>
	<script src="../libs/other/BinaryHeap.js"></script>
	<script src="../libs/tween/tween.min.js"></script>
	<script src="../libs/d3/d3.js"></script>
	<script src="../libs/proj4/proj4.js"></script>
	<script src="../libs/openlayers3/ol.js"></script>
	<script src="../libs/i18next/i18next.js"></script>
	<script src="../libs/jstree/jstree.js"></script>
	<script src="../build/potree/potree.js"></script>
	<script src="../libs/plasio/js/laslaz.js"></script>

	<div class="potree_container"
		style="position: absolute; width: 100%; height: 100%; left: 0px; top: 0px; display: flex; ">
		<div id="potree_description" class="potree_info_text" style="z-index: 100px;">
			Faces Revealed <br> Mummy Board Scans <br>
			<button id="txtbtn">Toggle Texture</button> <br>
		</div>
		<div style="width: 33.3%" id="potree_render_area">
		</div>
	</div>
	<div class="potree_container"
		style="position: absolute; width: 100%; height: 100%; left: 33.3%; top: 0px; display: flex; ">
		<div style="width: 33.3%" id="potree_render_area2">
		</div>
	</div>
	<div class="potree_container"
		style="position: absolute; width: 100%; height: 100%; left: 66%; top: 0px; display: flex; ">
		<div style="width: 33.4%" id="potree_render_area3">
		</div>
	</div>

	<script>

		viewer = new Potree.Viewer(document.getElementById("potree_render_area"));
		viewer2 = new Potree.Viewer(document.getElementById("potree_render_area2"));
		viewer3 = new Potree.Viewer(document.getElementById("potree_render_area3"));

		const viewers = [viewer3, viewer2, viewer];
		viewer.scene.view.position.set(-11230, -9729, 21522);
		viewer.scene.view.lookAt(2600, 2900, 10300);
		viewer.setFOV(60);
		viewer.loadSettingsFromURL();

		const loadPointClouds = [
			Potree.loadPointCloud("https://potree-test2.s3.us-west-2.amazonaws.com/FacesRevealed/MBiphonealigned/metadata.json", "iPhone"),
			Potree.loadPointCloud("https://potree-test2.s3.us-west-2.amazonaws.com/FacesRevealed/MBscanneraligned/metadata.json", "Scanner"),
			Potree.loadPointCloud("https://potree-test2.s3.us-west-2.amazonaws.com/FacesRevealed/MBstefaniaaligned/metadata.json", "Stefania")
			
		];

		Promise.all(loadPointClouds).then(results => {
			results.forEach((result, i) => {
				 
				const pointcloud = result.pointcloud;
				pointcloud.visible = true;
				pointcloud.position.set(0, 0, 0);
				pointcloud.scale.set(10, 10, 10);
				pointcloud.material.size = 1;
				pointcloud.material.pointSizeType = Potree.PointSizeType.ADAPTIVE;
				pointcloud.material.shape = Potree.PointShape.CIRCLE;
				pointcloud.material.activeAttributeName = "rgba";
				
				viewers[i].setEDLEnabled(true);
				viewers[i].setPointBudget(4 * 1000 * 1000);
				viewers[i].scene.addPointCloud(pointcloud);
			});
		});
			

		// Listen for camera changes
		viewer.addEventListener('camera_changed', (event) => {
			// When camera changes, override camera of other viewer
			viewer2.scene.overrideCamera = event.camera;
			viewer3.scene.overrideCamera = event.camera;

		});

	</script>

<script>
		//Toggle texture
		const btn = document.getElementById("txtbtn");
		let clicked = 0;

		btn.addEventListener("click", function () {
			if (clicked === 0) {
				viewers.forEach(viewer => {
					viewer.scene.pointclouds.forEach(pointcloud => {
						pointcloud.material.activeAttributeName = "classification";
					});
					viewer.setEDLStrength(10);
				});
				clicked = 1;
			} else {
				viewers.forEach(viewer => {
					viewer.scene.pointclouds.forEach(pointcloud => {
						pointcloud.material.activeAttributeName = "rgba";
					});
					viewer.setEDLStrength(0);
				});
				clicked = 0;
			}
		});

	</script>
	
</body>

</html>
