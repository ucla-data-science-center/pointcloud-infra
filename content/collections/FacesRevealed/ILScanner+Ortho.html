<!DOCTYPE html>
<html lang="en">

<head>
	<meta charset="utf-8">
	<meta name="description" content="">
	<meta name="author" content="">
	<meta name="viewport" content="width=device-width, initial-scale=1.0, user-scalable=no">
	<title>Faces Revealed</title>
	
	<link rel="stylesheet" type="text/css" href="../build/potree/potree.css">
	<link rel="stylesheet" type="text/css" href="../libs/jquery-ui/jquery-ui.min.css">
	<link rel="stylesheet" type="text/css" href="../libs/perfect-scrollbar/css/perfect-scrollbar.css">
	<link rel="stylesheet" type="text/css" href="../libs/openlayers3/ol.css">
	<link rel="stylesheet" type="text/css" href="../libs/spectrum/spectrum.css">
	<link rel="stylesheet" type="text/css" href="../libs/jstree/themes/mixed/style.css">
</head>

<body>
	<script src="../libs/jquery/jquery-3.1.1.min.js"></script>
	<script src="../libs/spectrum/spectrum.js"></script>
	<script src="../libs/jquery-ui/jquery-ui.min.js"></script>
	<script src="../libs/perfect-scrollbar/js/perfect-scrollbar.jquery.js"></script>
	<script src="../libs/three.js/build/three.min.js"></script>
	<script src="../libs/three.js/extra/lines.js"></script>
	<script src="../libs/other/BinaryHeap.js"></script>
	<script src="../libs/tween/tween.min.js"></script>
	<script src="../libs/d3/d3.js"></script>
	<script src="../libs/proj4/proj4.js"></script>
	<script src="../libs/openlayers3/ol.js"></script>
	<script src="../libs/i18next/i18next.js"></script>
	<script src="../libs/jstree/jstree.js"></script>
	<script src="../build/potree/potree.js"></script>
	<script src="../libs/plasio/js/laslaz.js"></script>

	
	<div class="potree_container"
		style="position: absolute; width: 100%; height: 100%; left: 0px; top: 0px; display: flex; ">
		<div id="potree_description" class="potree_info_text" style="z-index: 100px;">
			Faces Revealed <br> Inner Lid: Scanner and Ortho Dem Relief <br>
			<button id="txtbtn">Toggle Texture</button> <br>
		</div>
		<div style="width: 50%" id="potree_render_area">
		</div>
	</div>
	<div class="potree_container"
		style="position: absolute; width: 100%; height: 100%; left: 50%; top: 0px; display: flex; ">
		<div style="width: 50%" id="potree_render_area2">
			</div>
	</div>

	<script>

		window.viewer = new Potree.Viewer(document.getElementById("potree_render_area"));
		viewer.scene.view.position.set(-6380, -6030, 16680);
		viewer.scene.view.lookAt(2264, 2134, 8928);

		viewer.setEDLEnabled(true);
		viewer.setFOV(60);
		viewer.setPointBudget(4 * 1000 * 1000);
		viewer.loadSettingsFromURL();

		Potree.loadPointCloud("https://potree-test2.s3.us-west-2.amazonaws.com/FacesRevealed/ILscanneraligned/metadata.json", "iPhone").then(e => {
			e.pointcloud.position.set(0, 0, 0);
			e.pointcloud.scale.set(10, 10, 10);

			let material = e.pointcloud.material;
			material.activeAttributeName = "rgba";
			material.size = 2;
			material.pointSizeType = Potree.PointSizeType.ADAPTIVE;
			material.shape = Potree.PointShape.CIRCLE;

			viewer.scene.addPointCloud(e.pointcloud);
		});

		window.viewer2 = new Potree.Viewer(document.getElementById("potree_render_area2"));

		viewer2.setEDLEnabled(true);
		//viewer2.setEDLStrength(5.0);
		viewer2.setFOV(60);
		viewer2.setPointBudget(4 * 1000 * 1000);
		viewer2.setBackground("gradient");
		viewer2.loadSettingsFromURL();

		Potree.loadPointCloud("https://potree-test2.s3.us-west-2.amazonaws.com/FacesRevealed/ILOrthoDem/metadata.json", "iPhone").then(e => {
			let pointcloud = e.pointcloud;
			//pointcloud.position.set(2500, -600, 0);
			//pointcloud.position.set(-2500, 2600, 0);
			pointcloud.position.set(-1300, 2000, 500);
			pointcloud.scale.set(10, 10, 10);
			pointcloud.rotation.set(Math.PI * .24, Math.PI * -.22, Math.PI * -.17);

			let material = e.pointcloud.material;
			material.activeAttributeName = "rgba";
			material.size = 2;
			material.pointSizeType = Potree.PointSizeType.ADAPTIVE;
			material.shape = Potree.PointShape.CIRCLE;
			
			viewer2.scene.addPointCloud(pointcloud);
		});

		viewer.addEventListener('camera_changed', (event) => {
		
			viewer2.scene.overrideCamera = event.camera;
		});

		//Toggle texture
		const btn = document.getElementById("txtbtn");
		let clicked = 0;
		let viewerlist = [viewer, viewer2];

		btn.addEventListener("click",
			function () {
				if (clicked === 0) {
					for (let i = 0; i < viewerlist.length; i++) {
						let each = viewerlist[i];
						for (const pointcloud of each.scene.pointclouds) {
							pointcloud.material.activeAttributeName = "classification";
							viewer.setEDLStrength(5);
						};
					}
					clicked = 1;
				}
				else {
					for (let i = 0; i < viewerlist.length; i++) {
						let each = viewerlist[i];
						for (const pointcloud of each.scene.pointclouds) {
							pointcloud.material.activeAttributeName = "rgba";
							viewer.setEDLStrength(0);
						};
					}
					clicked = 0;
				}
			});

	</script>

</body>

</html>
