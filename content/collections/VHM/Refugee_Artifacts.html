		.header-title {

			top: 50%;

			margin: 0;
			font-size: 1.6em;
			font-weight: 500;
			color: #333;
			z-index: 1;
		}

		#header-primary img {

			width: auto;
			display: block;
		}
		
		#logo-rmci img {
			height: 8vh; 
		}

		#logo-vhm img {
			height: 8vh; 
		}

		/* --- Category Tabs --- */
		#category-tabs ul {
			display: flex;
			flex-direction: row;
			list-style: none;
			margin: 0;
			padding: 0;
			justify-content: center; 
		}

		#category-tabs li {
			padding: 1vh 1vh; 
			cursor: pointer;
			border-bottom: 3px solid transparent;
			transition: background-color 0.2s, border-color 0.2s;
			color: black; 
			font-size: 1.1em; 
			font-weight: 500;
			margin: 0 4px; 
			display: flex;
			align-items: center;
			height: 100%;
		}

		#category-tabs li:hover {
			background-color: rgba(0, 0, 0, 0.05); 
		}

		#category-tabs li.active {
			border-bottom-color: #FFD700; 
			font-weight: 700;
		}

		/* --- Right Sidebar Thumbnails --- */
		#object-thumbnails-container {
			position: absolute;
			right: 0px;
			top: 15vh; 
			flex-direction: column;
			display: flex;
			justify-content: flex-start;
			padding-top: 20px;
			width: 150px;
			height: calc(100% - 15vh); 
			z-index: 2;
			overflow-y: auto; 
		}

		.thumbnail-button {
			margin: 0 15px 15px 15px;
			cursor: pointer;
		}

		.thumbnail-image {
			width: 100%;
			opacity: 1;
			transition: opacity 0.3s ease, transform 0.3s ease;
			border: 2px solid #ccc; 
			border-radius: 4px;
			height: 10vh;
			object-fit: contain;
		}

		.thumbnail-image:hover {
			opacity: 0.8;
			transform: scale(1.05);
		}
		
		.thumbnail-image.active {
			border: 3px solid #FFD700; 
			box-shadow: 0 0 10px #FFD700;
		}

		/* --- Bottom-Left Info Box --- */
		#info-box {
			position: absolute;
			bottom: 20px;
			left: 20px;
			width: 30vw;
			height: 75vh; 
			background-color: rgba(0, 0, 0, 0.6);
			z-index: 2;
			color: white;
			border-radius: 7px;
			display: flex;
			flex-direction: column;
			transition: height 0.3s ease, width 0.3s ease;
			overflow: hidden;
		}
		
		#info-box a {
			color: #FFD700;
			text-decoration: none;
			border-bottom: 1px dotted #FFD700;
		}
		#info-box a:hover {
			text-decoration: underline;
		}

		#info-box-toggle {
			position: absolute;
			top: 5px;
			right: 5px;
			background: none;
			border: none;
			color: white;
			font-size: 1.5em;
			cursor: pointer;
			z-index: 5;
			padding: 5px;
			line-height: 1;
		}

		#info-box.collapsed {
			height: 40px; 
			width: 50px; 
		}

		#info-box.collapsed #info-box-content {
			display: none;
		}

			padding: 15px;
			padding-top: 45px; 
			overflow-y: auto; 
			line-height: 1.5;
			height: 100%;
			box-sizing: border-box; 
		}

		#potree_render_area {
			position: absolute;
			top: 15vh; 
			left: 0;
			width: 100%;
			height: calc(100% - 15vh);
		}

			width: 5vh; 
			max-height: 45px; 
			max-width: 45px;  
			background-color: white;
			border: 2px solid white;
			border-radius: 5px;
			z-index: 3; 
			cursor: pointer;
			box-sizing: border-box; 
			padding: 0;
		}

		#fullscreen-btn.maximize::before {
			content: "";
			display: block;
			width: 30%;
			height: 30%;
			border-top: 3px solid rgb(128, 128, 128);
			border-left: 3px solid rgb(128, 128, 128);
			position: absolute;
			top: 15%;
			left: 15%;
		}
		#fullscreen-btn.maximize::after {
			content: "";
			display: block;
			width: 30%;
			height: 30%;
			border-bottom: 3px solid rgb(128, 128, 128);
			border-right: 3px solid rgb(128, 128, 128);
			position: absolute;
			bottom: 15%;
			right: 15%;
		}

		#fullscreen-btn.minimize::before {
			content: "";
			display: block;
			width: 30%;
			height: 30%;
			border-bottom: 3px solid rgb(128, 128, 128);
			border-left: 3px solid rgb(128, 128, 128);
			position: absolute;
			bottom: 15%;
			left: 15%;
		}
		#fullscreen-btn.minimize::after {
			content: "";
			display: block;
			width: 30%;
			height: 30%;
			border-top: 3px solid rgb(128, 128, 128);
			border-right: 3px solid rgb(128, 128, 128);
			position: absolute;
			top: 15%;
			right: 15%;
		}

			right: 15px;

		// --- 2. POTREE VIEWER SETUP ---
		window.viewer = new Potree.Viewer(document.getElementById("potree_render_area"));
		viewer.loadSettingsFromURL();
		viewer.setEDLEnabled(true);
		viewer.setFOV(60);
		viewer.setPointBudget(4 * 1000 * 1000);
		viewer.setMinNodeSize(0);
		
		// MODIFIED: Hide the sidebar
		viewer.loadGUI(() => {
			$(".potree_menu_toggle").hide();
		});

		// --- 3. GLOBAL STATE ---
		window.allPointClouds = []; 
		let currentVisibleCloud = null;
		let currentActiveObject = null;
		let isTextureToggled = false; 
		
		const categoryTabsContainer = document.querySelector("#category-tabs ul");
		const thumbnailsContainer = document.getElementById("object-thumbnails-container");
		const infoBox = document.getElementById("info-box");
		const infoBoxContent = document.getElementById("info-box-content");

		// --- 4. CORE FUNCTIONS ---

		const formatVec = (v) => {
			if (!v) return "N/A";
			const x = v.x !== undefined ? v.x : v[0];
			const y = v.y !== undefined ? v.y : v[1];
			const z = v.z !== undefined ? v.z : v[2];
			return `[${x.toFixed(2)}, ${y.toFixed(2)}, ${z.toFixed(2)}]`;
		};

		const formatRot = (r) => {
			if (!r) return "N/A";
			const x = r.x.toFixed(3);
			const y = r.y.toFixed(3);
			const z = r.z.toFixed(3);
			return `[${x}, ${y}, ${z}]`;
		}

		function copyToClipboard(text) {
			if (!navigator.clipboard) {
				console.warn("Clipboard API not available");
				return;
			}
			navigator.clipboard.writeText(text).then(() => {
				console.log("Copied to clipboard:", text);
			}).catch(err => {
				console.error("Failed to copy:", err);
			});
		}

		function loadAllObjects() {
			let uniqueUrls = new Map();

			for (const categoryId in museumData) {
				museumData[categoryId].objects.forEach(obj => {
					if (!uniqueUrls.has(obj.cloudUrl)) {
						uniqueUrls.set(obj.cloudUrl, {
							name: obj.name,
							dependents: [obj] 
						});
					} else {
						uniqueUrls.get(obj.cloudUrl).dependents.push(obj);
					}
				});
			}

			uniqueUrls.forEach((data, url) => {
				Potree.loadPointCloud(url, data.name, function (e) {
					console.log(`Loaded: ${data.name}`);
					
					// ===== GLITCH FIX =====
					// Set invisible BEFORE adding to the scene
					// to prevent flashing.
					e.pointcloud.visible = false; 
					// ======================

					viewer.scene.addPointCloud(e.pointcloud);
					window.allPointClouds.push(e.pointcloud);

					data.dependents.forEach(objectData => {
						objectData.pointcloud = e.pointcloud;
						
						let material = e.pointcloud.material;
						material.pointColorType = Potree.PointColorType.RGBA;
						material.size = 0.66;
						material.pointSizeType = Potree.PointSizeType.ADAPTIVE;
						material.shape = Potree.PointShape.CIRCLE;
					});

					// This was the old line, now moved up
					// e.pointcloud.visible = false; 
				});
			});
		}

		function populateCategoryTabs() {
			categoryTabsContainer.innerHTML = ""; 
			for (const categoryId in museumData) {
				const category = museumData[categoryId];
				const tab = document.createElement("li");
				tab.innerText = category.name;
				tab.dataset.categoryId = categoryId;
				tab.addEventListener("click", () => showCategory(categoryId));
				categoryTabsContainer.appendChild(tab);
			}
		}

		function populateThumbnails(categoryId) {
			thumbnailsContainer.innerHTML = ""; 
			const objects = museumData[categoryId].objects;

			objects.forEach(objectData => {
				const btn = document.createElement("div");
				btn.className = "thumbnail-button";
				
				const img = document.createElement("img");
				img.src = objectData.thumbnail;
				img.className = "thumbnail-image";
				img.dataset.objectId = objectData.id;

				img.addEventListener("click", () => {
					showModel(objectData);
					
					thumbnailsContainer.querySelectorAll(".thumbnail-image").forEach(t => t.classList.remove("active"));
					img.classList.add("active");
				});

				btn.appendChild(img);
				thumbnailsContainer.appendChild(btn);
			});
		}

		function showCategory(categoryId) {
			categoryTabsContainer.querySelectorAll("li").forEach(tab => {
				tab.classList.toggle("active", tab.dataset.categoryId === categoryId);
			});

			populateThumbnails(categoryId);

			if (currentVisibleCloud) {
				currentVisibleCloud.visible = false;
				currentVisibleCloud = null;
			}
			infoBox.style.display = "none";
			currentActiveObject = null;
			
			const firstObject = museumData[categoryId].objects[0];
			if (firstObject) {
				
				const showFirstObject = () => {
					if (firstObject.pointcloud) {
						showModel(firstObject);
						
						const firstThumb = thumbnailsContainer.querySelector(".thumbnail-image");
						if(firstThumb) firstThumb.classList.add("active");
					} else {
						console.log("Waiting for", firstObject.name, "to load...");
						setTimeout(showFirstObject, 200); 
					}
				};
				
				showFirstObject();
				
			} else {
				 window.allPointClouds.forEach(p => {
					p.visible = false;
				 });
				 currentVisibleCloud = null;
			}
		}

		function showModel(objectData) {
			if (!objectData || !objectData.pointcloud) {
				console.warn("Attempted to show a model that is not loaded yet:", objectData);
				return;
			}
			
			window.allPointClouds.forEach(p => {
				p.visible = false;
			});

			objectData.pointcloud.visible = true;
			objectData.pointcloud.rotation.set(...objectData.rotation);
			objectData.pointcloud.position.set(...objectData.position);
			currentVisibleCloud = objectData.pointcloud;
			currentActiveObject = objectData;

			isTextureToggled = false;
			const material = currentVisibleCloud.material;
			material.activeAttributeName = "rgba";
			viewer.setEDLEnabled(true);
			viewer.setEDLStrength(1.0);

			viewer.scene.view.position.set(...objectData.cameraPos);
			viewer.scene.view.lookAt(...objectData.cameraTarget);

			infoBoxContent.innerHTML = objectData.description;
			infoBox.style.display = "flex";
		}
		
		function setupCameraDebugDisplay() {
			const elCamPos = document.getElementById("debug-cam-pos");
			const elCamTarget = document.getElementById("debug-cam-target");
			const elObjPos = document.getElementById("debug-obj-pos");
			const elObjRot = document.getElementById("debug-obj-rot");

			setInterval(() => {
				const camPos = viewer.scene.view.position;
				const camTarget = viewer.scene.view.getPivot();

				elCamPos.innerText = formatVec(camPos);
				elCamTarget.innerText = formatVec(camTarget);

				if (currentVisibleCloud) {
					elObjPos.innerText = formatVec(currentVisibleCloud.position);
					elObjRot.innerText = formatRot(currentVisibleCloud.rotation);
				} else {
					elObjPos.innerText = "N/A";
					elObjRot.innerText = "N/A";
				}

			}, 250);
		}

		function setupDebugToggle() {
			const debugPanel = document.getElementById("debug-info-floater");
			
			window.addEventListener("keydown", (e) => {
				if (e.key === 'd' || e.key === 'D') {
					debugPanel.classList.toggle("debug-hidden");
				}
			});
		}

		function setupTextureToggle() {
			window.addEventListener("keydown", (e) => {
				if (e.key !== 't' && e.key !== 'T') {
					return;
				}

				if (!currentVisibleCloud) {
					return;
				}

				const material = currentVisibleCloud.material;

				if (isTextureToggled) {
					material.activeAttributeName = "rgba";
					viewer.setEDLEnabled(true);
					viewer.setEDLStrength(1.0);
					isTextureToggled = false;
				} else {
					material.activeAttributeName = "classification";
					viewer.setEDLEnabled(2.0);
					isTextureToggled = true;
				}
			});
		}

		function setupClipboardKeys() {
			window.addEventListener("keydown", (e) => {
				let textToCopy = "";

				switch (e.key) {
					case 'o':
						textToCopy = formatVec(viewer.scene.view.position);
						break;
					case 'p':
						textToCopy = formatVec(viewer.scene.view.getPivot());
						break;
					case 'k':
						if (currentVisibleCloud) {
							textToCopy = formatVec(currentVisibleCloud.position);
						} else {
							console.log("No object selected to copy position.");
						}
						break;
					case 'l':
						if (currentVisibleCloud) {
							textToCopy = formatRot(currentVisibleCloud.rotation);
						} else {
							console.log("No object selected to copy rotation.");
						}
						break;
					default:
						return;
				}

				if (textToCopy) {
					copyToClipboard(textToCopy);
				}
			});
		}

		function setupFullscreenToggle() {
			const fsBtn = document.getElementById("fullscreen-btn");

			function openFullscreen() {
				const elem = document.documentElement;
				const promise = (elem.requestFullscreen && elem.requestFullscreen()) ||
								(elem.mozRequestFullScreen && elem.mozRequestFullScreen()) ||
								(elem.webkitRequestFullscreen && elem.webkitRequestFullscreen()) ||
								(elem.msRequestFullscreen && elem.msRequestFullscreen());
				if (promise) {
					promise.catch(err => {
						console.error(`Error attempting to enter fullscreen: ${err.message} (${err.name})`);
					});
				} else {
					console.warn("No fullscreen API available on this element.");
				}
			}

			function closeFullscreen() {
				const promise = (document.exitFullscreen && document.exitFullscreen()) ||
								(document.mozCancelFullScreen && document.mozCancelFullScreen()) ||
								(document.webkitExitFullscreen && document.webkitExitFullscreen()) ||
								(document.msExitFullscreen && document.msExitFullscreen());
				
				if (promise) {
					promise.catch(err => {
						console.error(`Error attempting to exit fullscreen: ${err.message} (${err.name})`);
					});
				} else {
					console.warn("No exit fullscreen API available on this document.");
				}
			}

			function toggleFullscreen() {
				const isFullscreen = document.fullscreenElement ||
									document.webkitFullscreenElement ||
									document.mozFullScreenElement ||
									document.msFullscreenElement;
				
				if (isFullscreen) {
					closeFullscreen();
				} else {
					openFullscreen();
				}
			}

			function updateButtonState() {
				const isFullscreen = document.fullscreenElement ||
									document.webkitFullscreenElement ||
									document.mozFullScreenElement ||
									document.msFullscreenElement;
				
				if (isFullscreen) {
					fsBtn.classList.remove("maximize");
					fsBtn.classList.add("minimize");
					fsBtn.title = "Exit Fullscreen";
				} else {
					fsBtn.classList.remove("minimize");
					fsBtn.classList.add("maximize");
					fsBtn.title = "Enter Fullscreen";
				}
			}

			fsBtn.addEventListener("click", toggleFullscreen);

			window.addEventListener("keydown", (e) => {
				if (e.key === 'f' || e.key === 'F') {
					toggleFullscreen();
				}
			});

			document.addEventListener("fullscreenchange", updateButtonState);
			document.addEventListener("webkitfullscreenchange", updateButtonState);
			document.addEventListener("mozfullscreenchange", updateButtonState);
			document.addEventListener("MSFullscreenChange", updateButtonState);

			updateButtonState();
		}

		function setupInfoBoxToggle() {
			const infoBox = document.getElementById("info-box");
			const toggleBtn = document.getElementById("info-box-toggle");

			toggleBtn.addEventListener("click", (e) => {
				e.stopPropagation(); 
				
				const isCollapsed = infoBox.classList.toggle("collapsed");

				if (isCollapsed) {
					toggleBtn.innerHTML = "&#9650;"; // Up arrow
					toggleBtn.title = "Show Details";
				} else {
					toggleBtn.innerHTML = "&#9660;"; // Down arrow
					toggleBtn.title = "Hide Details";
				}
			});
		}


		// --- 5. INITIALIZATION ---
		
		loadAllObjects();
		populateCategoryTabs();
		
		setupCameraDebugDisplay();
		setupDebugToggle();
		setupTextureToggle();
		setupClipboardKeys(); 
		
		setupFullscreenToggle();
		setupInfoBoxToggle();
