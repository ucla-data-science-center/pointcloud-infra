    						<p><strong>Description:</strong> Used by former South Vietnamese officer Đoàn Việt during his 1987 escape to Singapore, these tools were essential to navigating a small fishing boat across the South China Sea. The military compass allowed him to chart latitude and longitude with hand-drawn nautical maps, while the calipers helped measure distance and plot bearings. Because unauthorized travel was banned, acquiring such instruments was dangerous—Đoàn obtained them through black-market networks at great personal risk.</p>
						</div>
                        `,
						mapImage: "placeholder-map-2.jpg",
						cameraPos: [225, -1000, 0],
						cameraTarget: [220, 0, 0],
						rotation: [0, 0, -Math.PI * 0.5],
						position: [0, 0, -100]
					},

					{
						id: "caliper",
						name: "Caliper",
						thumbnail: "resources/place-holder.png",
						cloudUrl: "https://potree-test2.s3.us-west-2.amazonaws.com/VHM/Calipers/metadata.json",
						description: `

    						<p><strong>Donor:</strong> Đoàn Việt</p>
    						<p><strong>Description:</strong> Used by former South Vietnamese officer Đoàn Việt during his 1987 escape to Singapore, these tools were essential to navigating a small fishing boat across the South China Sea. The military compass allowed him to chart latitude and longitude with hand-drawn nautical maps, while the calipers helped measure distance and plot bearings. Because unauthorized travel was banned, acquiring such instruments was dangerous—Đoàn obtained them through black-market networks at great personal risk.</p>

                        `,
						mapImage: "placeholder-map-2.jpg",

						rotation: [0, 0, -Math.PI * 0.5],
						position: [0, 0, -100]
					},
				]
			},
			"refugee-camp": {
				name: "Refugee Camp",
				objects: [
					{
						id: "trunk_copy",
						name: "Trunk (Refugee)",
						thumbnail: "resources/trunk.png",
						cloudUrl: "https://potree-test2.s3.us-west-2.amazonaws.com/VHM/Trunk/metadata.json",
						description: `
                        <div class="artifact-card">
                            <h3>Wooden chest</h3>
                            <p><strong>RMCI Database No.:</strong> VHM_0019</p>
                            <p><strong>Date:</strong> c. 1990s</p>
                            <p><strong>Donor:</strong> Lê Xuân Mùi</p>
                            <p><strong>Description:</strong> This chest was made out of repurposed materials at the Galang refugee camp in Indonesia by Lê Xuân Mùi. The wood comes from the boards of the rotting barracks at the camp and the aluminum handle and clasps are made from materials (e.g. pots) issued by UNHCR. This chest was used to hold mementos from Lê Xuân Mùi's time at the refugee camp. Since Lê Xuân Mùi arrived at the Galang refugee camp on March 13, 1990, after the adoption of the Comprehensive Plan of Action, he was not automatically granted refugee status and was subject to screening to qualify as a refugee. He was ultimately repatriated to Vietnam on August 19, 1996.</p>
                        </div>
                        `,
						mapImage: "placeholder-map-2.jpg",
						cameraPos: [225, -1000, 0],
						cameraTarget: [220, 0, 0],
						rotation: [0, 0, -Math.PI * 0.5],
						position: [0, 0, -100]
					},

					{
						id: "camera",
						name: "Camera",
						thumbnail: "place-holder.png",
						cloudUrl: "https://potree-test2.s3.us-west-2.amazonaws.com/VHM/Camera/metadata.json",
						description: `
                        <div class="artifact-card">
    						<h3>Camera</h3>
    						<p><strong>RMCI Database No.:</strong> VHM_0047</p>
    						<p><strong>Date:</strong> post-1975</p>
    						<p><strong>Donor:</strong> Lê Phú Minh</p>
    						<p><strong>Description:</strong> This camera was used by Lê Phú Minh to earn a living during her time at a refugee camp in the Philippines. She borrowed money to purchase it and used it to take portraits of fellow refugees. The printed photos were sold in exchange for pisos—a common currency in the camp, often sent by relatives abroad or earned through local labor. When she resettled in the United States, she brought the camera with her. None of the original photographs remain, as all were distributed at the time and no film was preserved.</p>
						</div>
                        `,
						mapImage: "placeholder-map-2.jpg",
						cameraPos: [225, -1000, 0],
						cameraTarget: [220, 0, 0],
						rotation: [0, 0, -Math.PI * 0.5],
						position: [0, 0, -100]
					}
				]
			}
		};

		// --- 2. POTREE VIEWER SETUP ---
		window.viewer = new Potree.Viewer(document.getElementById("potree_render_area"));
		viewer.loadSettingsFromURL();
		viewer.setEDLEnabled(true);
		viewer.setFOV(60);
		viewer.setPointBudget(4 * 1000 * 1000);
		viewer.setMinNodeSize(0);
		viewer.loadGUI(() => {
			$(".potree_menu_toggle").hide();
		});

		// --- 3. GLOBAL STATE ---
		window.allPointClouds = []; 
		let currentVisibleCloud = null;
		let currentActiveObject = null;
		
		const categoryTabsContainer = document.querySelector("#category-tabs ul");
		const thumbnailsContainer = document.getElementById("object-thumbnails-container");
		const infoBox = document.getElementById("info-box");
		const infoBoxContent = document.getElementById("info-box-content");
		const mapContent = document.getElementById("map-content");
		const mapImage = mapContent.querySelector("img");
		const toggleDetailsBtn = document.getElementById("toggle-details");
		const toggleMapBtn = document.getElementById("toggle-map");

		// --- 4. CORE FUNCTIONS ---

		// ==========================================================
		// ==       CORRECTED FUNCTION 1 (From previous step)      ==
		// ==========================================================
		function loadAllObjects() {
			let uniqueUrls = new Map();

			for (const categoryId in museumData) {
				museumData[categoryId].objects.forEach(obj => {
					if (!uniqueUrls.has(obj.cloudUrl)) {
						uniqueUrls.set(obj.cloudUrl, {
							name: obj.name,
							dependents: [obj] 
						});
					} else {
						uniqueUrls.get(obj.cloudUrl).dependents.push(obj);
					}
				});
			}

			uniqueUrls.forEach((data, url) => {
				Potree.loadPointCloud(url, data.name, function (e) {
					console.log(`Loaded: ${data.name}`);
					viewer.scene.addPointCloud(e.pointcloud);
					window.allPointClouds.push(e.pointcloud);

					data.dependents.forEach(objectData => {
						// Link the loaded pointcloud back to the object data
						objectData.pointcloud = e.pointcloud;
						
						// DO NOT set rotation or position here
						
						let material = e.pointcloud.material;
						material.pointColorType = Potree.PointColorType.RGBA;
						material.size = 0.66;
						material.pointSizeType = Potree.PointSizeType.ADAPTIVE;
						material.shape = Potree.PointShape.CIRCLE;
					});

					// Set visible to false on load
					e.pointcloud.visible = false; 
				});
			});
		}

		function populateCategoryTabs() {
			categoryTabsContainer.innerHTML = ""; 
			for (const categoryId in museumData) {
				const category = museumData[categoryId];
				const tab = document.createElement("li");
				tab.innerText = category.name;
				tab.dataset.categoryId = categoryId;
				tab.addEventListener("click", () => showCategory(categoryId));
				categoryTabsContainer.appendChild(tab);
			}
		}

		function populateThumbnails(categoryId) {
			thumbnailsContainer.innerHTML = ""; 
			const objects = museumData[categoryId].objects;

			objects.forEach(objectData => {
				const btn = document.createElement("div");
				btn.className = "thumbnail-button";
				
				const img = document.createElement("img");
				img.src = objectData.thumbnail;
				img.className = "thumbnail-image";
				img.dataset.objectId = objectData.id;

				img.addEventListener("click", () => {
					showModel(objectData);
					
					thumbnailsContainer.querySelectorAll(".thumbnail-image").forEach(t => t.classList.remove("active"));
					img.classList.add("active");
				});

				btn.appendChild(img);
				thumbnailsContainer.appendChild(btn);
			});
		}

		// ==========================================================
		// ==       CORRECTED FUNCTION 2 (NEWLY UPDATED)           ==
		// ==========================================================
		function showCategory(categoryId) {
			// 1. Highlight the correct tab
			categoryTabsContainer.querySelectorAll("li").forEach(tab => {
				tab.classList.toggle("active", tab.dataset.categoryId === categoryId);
			});

			// 2. Populate the thumbnails for that category
			populateThumbnails(categoryId);

			// 3. Hide any *currently* visible cloud and the info box.
			if (currentVisibleCloud) {
				currentVisibleCloud.visible = false;
				currentVisibleCloud = null;
			}
			infoBox.style.display = "none";
			currentActiveObject = null;
			
			// 4. Find and display the first object in this category
			const firstObject = museumData[categoryId].objects[0];
			if (firstObject) {
				
				// We need to wait until the cloud is *actually loaded*.
				// This recursive function will check every 200ms
				// until the .pointcloud property exists.
				const showFirstObject = () => {
					if (firstObject.pointcloud) {
						// It's loaded, show it.
						showModel(firstObject);
						
						// Also highlight the first thumbnail
						const firstThumb = thumbnailsContainer.querySelector(".thumbnail-image");
						if(firstThumb) firstThumb.classList.add("active");
					} else {
						// It's not loaded yet, wait and try again.
						console.log("Waiting for", firstObject.name, "to load...");
						setTimeout(showFirstObject, 200); // check again in 200ms
					}
				};
				
				// Start the check
				showFirstObject();
				
			} else {
				 // If category is empty, make sure everything is hidden.
				 window.allPointClouds.forEach(p => {
					p.visible = false;
				 });
				 currentVisibleCloud = null;
			}
		}

		// ==========================================================
		// ==       CORRECTED FUNCTION 3 (From previous step)      ==
		// ==========================================================
		function showModel(objectData) {
			if (!objectData || !objectData.pointcloud) {
				console.warn("Attempted to show a model that is not loaded yet:", objectData);
				return;
			}
			
			// --- START OF CRITICAL FIX ---

			// 1. Hide ALL point clouds in the scene
			window.allPointClouds.forEach(p => {
				p.visible = false;
			});

			// 2. Show ONLY the selected one
			objectData.pointcloud.visible = true;

			// 3. Apply the correct position and rotation for THIS object
			objectData.pointcloud.rotation.set(...objectData.rotation);
			objectData.pointcloud.position.set(...objectData.position);

			// 4. Update the global "current" variable
			currentVisibleCloud = objectData.pointcloud;
			
			// --- END OF CRITICAL FIX ---


			currentActiveObject = objectData;

			// Update camera
			viewer.scene.view.position.set(...objectData.cameraPos);
			viewer.scene.view.lookAt(...objectData.cameraTarget);

			// Update info box
			infoBoxContent.innerHTML = objectData.description;
			mapImage.src = objectData.mapImage || "placeholder-map.jpg";
			mapImage.alt = `Map for ${objectData.name}`;
			infoBox.style.display = "flex";
			
			// Ensure details tab is active
			infoBoxContent.style.display = "block";
			mapContent.style.display = "none";
			toggleDetailsBtn.classList.add("active");
			toggleMapBtn.classList.remove("active");
		}
		
		function setupInfoToggles() {
			toggleDetailsBtn.addEventListener("click", () => {
				infoBoxContent.style.display = "block";
				mapContent.style.display = "none";
				toggleDetailsBtn.classList.add("active");
				toggleMapBtn.classList.remove("active");
			});
			
			toggleMapBtn.addEventListener("click", () => {
				infoBoxContent.style.display = "none";
				mapContent.style.display = "block";
				toggleDetailsBtn.classList.remove("active");
				toggleMapBtn.classList.add("active");
			});
		}


		// --- 5. INITIALIZATION ---
		
		loadAllObjects();
		populateCategoryTabs();
		setupInfoToggles();

		// Show the first category by default.
		// This will now trigger the new `showCategory` logic,
		// which hides all clouds and auto-shows the first item.
		showCategory("land-reform"); 

	</script>
